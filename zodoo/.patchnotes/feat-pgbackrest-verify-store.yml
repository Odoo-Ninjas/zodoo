type: feature
breaking: false
description: |
  Jeder Nachweis einer Rueckspielprobe sagt jetzt, aus WELCHEM Bestand er
  stammt - im Ergebnis (Feld `store`) und im Dateinamen
  (`<bereich>-<bestand>-<zeitstempel>.json`).

  Hintergrund: seit der Pruefstand beide Bestaende prueft (Repo-Host und
  gespiegelten Objektspeicher), entstehen je Bereich zwei Nachweise - und die
  sahen gleich aus. Die Ueberwachung nimmt je Bereich den juengsten
  BESTANDENEN; ein durchgefallener Zweitbestand verschwand damit hinter dem
  bestandenen Erstbestand. Ausgerechnet die Probe, die eine Vermutung durch
  einen Nachweis ersetzen soll, haette also wieder eine Vermutung gedeckt.

  Zum Ausprobieren: in der Pruefstand-Konfiguration `"store": "zweitbestand"`
  setzen (frei benennbar - `s3` unterscheidet zwei Objektspeicher nicht,
  sobald es zwei gibt) und einen Lauf mit `--report-to` machen. Im
  Ablageordner liegen danach zwei Dateien nebeneinander, deren Namen
  auseinanderhalten, was frueher uebereinander lag. Ohne Angabe bleibt die Art
  (`s3` bzw. `tls`), im Projektbetrieb steht `projekt`.

  Worauf zu achten ist: auch der FEHLERFALL traegt den Bestand.
  "Gescheitert" ohne die Angabe wo ist keine brauchbare Nachricht - und
  frueher war es genau der Pfad, der gar kein `store` gesetzt hat.
