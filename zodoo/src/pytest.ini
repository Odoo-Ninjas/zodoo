[pytest]
testpaths = zodoo/tests
python_files = test_*.py

# Default coverage targets the three modules that have explicit unit-test
# coverage. Run `pytest` for a plain run or `pytest --cov=zodoo` for a full
# package-level picture.
addopts = --cov=zodoo.lib_control --cov=zodoo.lib_backup --cov=zodoo.lib_docker_registry --cov-report=term-missing --no-cov-on-fail
