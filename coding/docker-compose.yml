services:
  coding_trigger:
    build:
      context: $ODOO_IMAGES/coding/trigger
    restart: "unless-stopped"
    profiles:
      - manual
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOST_RUN_DIR}:/opt/run:ro
    environment:
      PROJECT_NAME: ${project_name}
      TRIGGER_PORT: 8090
      COMPOSE_FILE: /opt/run/docker-compose.yml

  coding:
    labels:
      proxy_config: ${ODOO_IMAGES}/coding/proxy/coding.conf
      proxy_config_vim: ${ODOO_IMAGES}/coding/proxy/codevim.conf
    build:
      context: $ODOO_IMAGES
      dockerfile: coding/Dockerfile
    restart: "unless-stopped"
    profiles:
      - manual
    environment:
      OWNER_UID: ${OWNER_UID}
      TRIGGER_URL: http://coding_trigger:8090
      CODING_TRIGGER_URL: http://coding_trigger:8090
    volumes:
      - ${HOST_CUSTOMS_DIR}:/opt/src
      - ${ODOO_IMAGES}:/opt/images
      - ${HOST_RUN_DIR}:/opt/run
      # zodoo CLI source — bind-mounted so CLI updates don't require rebuilds.
      - ${ODOO_IMAGES}/zodoo/src:/opt/zodoo:rw
    depends_on:
      - coding_trigger
