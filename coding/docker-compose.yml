services:
  coding_trigger:
    build:
      context: $ODOO_IMAGES/coding/trigger
    restart: "unless-stopped"
    profiles:
      - manual
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOST_RUN_DIR}:/opt/run:ro
    environment:
      PROJECT_NAME: ${project_name}
      TRIGGER_PORT: 8090
      COMPOSE_FILE: /opt/run/docker-compose.yml

  coding:
    labels:
      proxy_config: ${ODOO_IMAGES}/coding/proxy/coding.conf
      proxy_config_vim: ${ODOO_IMAGES}/coding/proxy/codevim.conf
    build:
      context: $ODOO_IMAGES
      dockerfile: coding/Dockerfile
    restart: "unless-stopped"
    profiles:
      - manual
    environment:
      OWNER_UID: ${OWNER_UID}
      TRIGGER_URL: http://coding_trigger:8090
      CODING_TRIGGER_URL: http://coding_trigger:8090
    volumes:
      # The customer's source code -- what is worked on in the editor, and
      # the only thing it may write to.
      - ${HOST_CUSTOMS_DIR}:/opt/src
      # Everything else read-only. The editor comes with a terminal, and
      # these three directories do not belong to the single instance:
      #
      #  - /opt/run holds the docker-compose.yml that the trigger brings up
      #    with `-f`. Writable, it would be the way around every check in the
      #    trigger: containers with arbitrary mounts, so the whole host.
      #  - /opt/images and /opt/zodoo are shared by all instances on a
      #    machine that hosts more than one. Writing there plants code that
      #    root later runs for another instance.
      #
      # Working on zodoo itself happens outside the editor.
      - ${ODOO_IMAGES}:/opt/images:ro
      - ${HOST_RUN_DIR}:/opt/run:ro
      - ${ODOO_IMAGES}/zodoo/src:/opt/zodoo:ro
    depends_on:
      - coding_trigger
