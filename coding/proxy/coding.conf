# proxy_host: coding:8080
location /code {
    return 301 $scheme://$http_host/code/;
}
location /code/ {
    # Throttle login attempts on /code/__auth (same map/zone as the dashboard
    # gate; every other /code request has an empty key and is skipped).
    limit_req zone=dashauth burst=5 nodelay;
    limit_req_status 429;
    rewrite_by_lua_block {
        -- The editor is a shell on this machine. Without a gate it would be
        -- open to anyone who knows the host name, so it is guarded exactly
        -- like /system: one password, a signed cookie, no user name. An empty
        -- CODING_PASSWORD (DEVMODE) leaves it open, as it does there.
        require("dashauth").gate(os.getenv("CODING_PASSWORD"), "/code", "zodoo code")

        -- Toggle vim extension via ?vim=1 (enable) or ?vim=0 (disable)
        local vim_param = ngx.var.arg_vim
        if vim_param ~= nil then
            local endpoint = "/vim/enable"
            if vim_param == "0" then
                endpoint = "/vim/disable"
            end
            local sock = ngx.socket.tcp()
            sock:settimeout(2000)
            local ok, err = sock:connect("coding", 8081)
            if ok then
                sock:send("GET " .. endpoint .. " HTTP/1.0\r\nHost: coding\r\n\r\n")
                sock:receive("*a")
                sock:close()
            else
                ngx.log(ngx.WARN, "vim-toggle connect failed: ", err)
            end
            return ngx.redirect("/code/")
        end
    }

    set $backend $default_target;
    access_by_lua_file "{lua_resolve_host}";
    proxy_pass $backend;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header Accept-Encoding gzip;

    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_connect_timeout 86400s;
}
