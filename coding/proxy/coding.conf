# proxy_host: coding:8080
location /code1 {
    return 301 $scheme://$http_host/code1/;
}
location /code1/ {
    # Toggle vim extension via ?vim=1 (enable) or ?vim=0 (disable)
    rewrite_by_lua_block {
        local vim_param = ngx.var.arg_vim
        if vim_param ~= nil then
            local endpoint = "/vim/enable"
            if vim_param == "0" then
                endpoint = "/vim/disable"
            end
            local sock = ngx.socket.tcp()
            sock:settimeout(2000)
            local ok, err = sock:connect("coding", 8081)
            if ok then
                sock:send("GET " .. endpoint .. " HTTP/1.0\r\nHost: coding\r\n\r\n")
                sock:receive("*a")
                sock:close()
            else
                ngx.log(ngx.WARN, "vim-toggle connect failed: ", err)
            end
            return ngx.redirect("/code1/")
        end
    }

    set $backend $default_target;
    access_by_lua_file "{lua_resolve_host}";
    proxy_pass $backend;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header Accept-Encoding gzip;

    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_connect_timeout 86400s;
}
