name: Pytest

# Unit-test suite for the zodoo CLI. Fast (< 1 min), no docker / network.
# Heavy integration tests live in `bake-test.yml` and are marked @slow —
# they are not run here.

on:
  pull_request:
    branches: [main]
    paths:
      - "zodoo/src/**"
      - ".github/workflows/pytest.yml"
  push:
    branches: [main]
    paths:
      - "zodoo/src/**"
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pipx
        run: |
          python -m pip install --upgrade pip pipx

      - name: Install zodoo (editable, from this checkout)
        run: |
          pipx install -e zodoo/src
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Inject pytest into zodoo venv
        # zodoo lives in its own pipx venv; pytest must run there so it
        # can import zodoo + click + passlib + ... from the same env.
        run: |
          pipx inject zodoo pytest pytest-cov

      - name: Run unit tests
        working-directory: zodoo/src
        run: |
          "$HOME/.local/pipx/venvs/zodoo/bin/python" -m pytest -m "not slow" -vv
