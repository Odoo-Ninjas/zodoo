name: Pytest

# Unit-test suite for the zodoo CLI. Fast (< 1 min), no docker / network.
# Heavy integration tests live in `bake-test.yml` and are marked @slow —
# they are not run here.

# Kein paths-Filter. Die Suite braucht keine Minute, der Filter sparte also
# kaum etwas - kostete aber Deckung: Tests liegen zwar unter zodoo/src, pruefen
# von dort aus aber auch Dateien ausserhalb (test_cronjobs_run laedt
# cronjobs/bin/run.py, test_router_vhost_wizard laedt
# router_global/render_configs.py). Wer genau die Datei aenderte, die ein Test
# prueft, bekam den Test nicht zu sehen. Ein Filter, den man bei jeder neuen
# Testdatei nachpflegen muss, ist irgendwann falsch.
on:
  pull_request:
    branches: [main]
  # Auch bei direkten Pushes auf main (z.B. fix-merges via gh CLI ohne PR),
  # damit Test-Feedback nicht erst beim Release-on-merge sichtbar wird.
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # fail-fast aus: schlaegt eine Version fehl, sollen die anderen
      # trotzdem durchlaufen - sonst sieht man nicht, ob es an der einen
      # Version haengt oder an allen.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pipx
        run: |
          python -m pip install --upgrade pip pipx

      - name: Install zodoo (editable, from this checkout)
        run: |
          pipx install -e zodoo/src
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Inject pytest into zodoo venv
        # zodoo lives in its own pipx venv; pytest must run there so it
        # can import zodoo + click + passlib + ... from the same env.
        # cd /tmp: newer pipx treats `zodoo` as a path when a ./zodoo/
        # directory exists in cwd, breaking the inject.
        working-directory: /tmp
        run: |
          pipx inject zodoo pytest pytest-cov

      - name: Run unit tests
        working-directory: zodoo/src
        run: |
          ZODOO_PY="$(pipx environment --value PIPX_LOCAL_VENVS)/zodoo/bin/python"
          "$ZODOO_PY" -m pytest -m "not slow" -vv
