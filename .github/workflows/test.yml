name: Branch Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches-ignore:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run test script
        run: |
          set -e
          mkdir ~/.odoo
          rsync ./ ~/.odoo/images/ -ar

          pipx install gimera
          cd wodoo/src
          pipx install -e .
          cd -
          chmod +x ./tests.sh
          ./tests.sh