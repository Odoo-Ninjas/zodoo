name: Release on merge

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pipx
        run: |
          python -m pip install --upgrade pip pipx

      - name: Install zodoo (editable, from this checkout)
        run: |
          pipx install -e zodoo/src
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Inject pytest into zodoo venv
        # cd /tmp: newer pipx treats `zodoo` as a path when a ./zodoo/
        # directory exists in cwd, breaking the inject.
        working-directory: /tmp
        run: |
          pipx inject zodoo pytest pytest-cov

      - name: Run unit tests
        working-directory: zodoo/src
        run: |
          ZODOO_PY="$(pipx environment --value PIPX_LOCAL_VENVS)/zodoo/bin/python"
          "$ZODOO_PY" -m pytest -m "not slow" -vv

  bake:
    uses: ./.github/workflows/bake-test.yml
    with:
      versions: "19.0"

  release:
    needs: [test, bake]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Use a PAT so the release commit/tag can be pushed past the
          # `main` branch protection (the default GITHUB_TOKEN is not in
          # the ruleset bypass list; Repository admin is).
          token: ${{ secrets.RELEASE_PAT }}

      - name: Check for patchnotes
        id: check
        run: |
          NOTES=$(find .patchnotes -name '*.yml' -not -name '*.template' 2>/dev/null | head -1)
          if [ -z "$NOTES" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No patchnotes found, skipping release."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect patchnotes and bump version
        if: steps.check.outputs.skip == 'false'
        id: bump
        run: |
          set -euo pipefail

          CURRENT_VERSION=$(cat VERSION)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

          # Fragmente einsammeln - per YAML-Parser, nicht per grep. Die
          # Blockschreibweise `description: |` hat der alte grep zu einem
          # einzelnen "|" gemacht und den Text weggeworfen; 36 Changelog-
          # Eintraege sind so entstanden (siehe scripts/collect_patchnotes.py).
          python3 -c "import yaml" 2>/dev/null || python3 -m pip install --quiet pyyaml
          GESAMMELT=$(python3 scripts/collect_patchnotes.py .patchnotes)
          BUMP=$(echo "$GESAMMELT" | python3 -c "import json,sys; print(json.load(sys.stdin)['bump'])")
          CHANGELOG_ENTRIES=$(echo "$GESAMMELT" | python3 -c "import json,sys; print('\\n'.join(json.load(sys.stdin)['entries']))")

          # if/fi und nicht `[ ... ] && x=y`: unter `set -e` ist eine nicht
          # zutreffende Bedingung der Rueckgabewert der ganzen Zeile und
          # beendet den Schritt.
          HAS_BREAKING=false
          HAS_FEATURE=false
          if [ "$BUMP" = "major" ]; then HAS_BREAKING=true; fi
          if [ "$BUMP" = "minor" ]; then HAS_FEATURE=true; fi

          if [ "$HAS_BREAKING" = "true" ]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif [ "$HAS_FEATURE" = "true" ]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "$NEW_VERSION" > VERSION

          # Sync version to zodoo package
          sed -i "s/^version = .*/version = ${NEW_VERSION}/" zodoo/src/setup.cfg
          echo "$NEW_VERSION" > zodoo/src/zodoo/version.txt

          # Prepend new section to CHANGELOG.md
          TMPFILE=$(mktemp)
          {
            echo "# Changelog"
            echo ""
            echo "## ${NEW_VERSION}"
            echo ""
            printf '%s\n' "$CHANGELOG_ENTRIES"
            echo ""
            # Append old changelog without the first line (# Changelog)
            tail -n +2 CHANGELOG.md
          } > "$TMPFILE"
          mv "$TMPFILE" CHANGELOG.md

          # Remove processed patchnotes
          find .patchnotes -name '*.yml' -not -name '*.template' -delete

          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "entries<<EOF" >> "$GITHUB_OUTPUT"
          echo -e "$CHANGELOG_ENTRIES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        if: steps.check.outputs.skip == 'false'
        id: tag
        run: |
          TAG="v${{ steps.bump.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            if git merge-base --is-ancestor "$TAG" HEAD; then
              # Release already landed on main, this is a re-run.
              echo "tagged=false" >> "$GITHUB_OUTPUT"
              echo "Tag $TAG already exists and is contained in main, nothing to do."
              exit 0
            fi
            # The tag exists but its commit never made it onto main, so every
            # run recomputes the same version and finds the tag again. Silently
            # skipping here blocks all further releases behind a green check.
            echo "::error::Tag $TAG exists but is not an ancestor of main." \
                 "main is at version $(git show HEAD:VERSION) and its patchnotes" \
                 "recompute to $TAG. Reconcile main with the tag (apply the" \
                 "release commit) before further releases can be cut."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION CHANGELOG.md .patchnotes/ zodoo/src/setup.cfg zodoo/src/zodoo/version.txt
          git commit -m "release $TAG"
          git tag "$TAG"
          # --atomic: without it a rejected main (branch protection) still
          # leaves the tag pushed, which is exactly how the repo got wedged.
          git push --atomic origin main "$TAG"
          echo "tagged=true" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.check.outputs.skip == 'false' && steps.tag.outputs.tagged == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Via env, never interpolated into the script: patchnote text is
          # arbitrary prose. Pasted inline, its backticks ran as command
          # substitution and '<domain>' parsed as a redirect, so the step
          # died with "command not found" / "syntax error" — and anything
          # in a description would execute on the runner.
          TAG: v${{ steps.bump.outputs.version }}
          NOTES: ${{ steps.bump.outputs.entries }}
        run: |
          printf '%s\n' "$NOTES" > /tmp/release-notes.md
          gh release create "$TAG" --title "$TAG" --notes-file /tmp/release-notes.md
