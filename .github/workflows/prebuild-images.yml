name: Prebuild generic images

# Baut die projektunabhaengigen Images und schiebt sie in die zodoo-Registry.
#
# Warum: eine frisch aufgesetzte Kundenmaschine baut sonst jede Stufe selbst.
# Gemessen auf einer cpx22 sind das 6:24 von 11:44 Gesamtzeit -- mehr als die
# Haelfte. Die Tags der allgemeinen Images haengen nur an Odoo-/Postgres-/
# Python-Version und am Inhalt des Image-Verzeichnisses, sind also fuer ALLE
# Kunden dieselben. Liegen sie in der Registry, wird daraus ein Pull.
#
# Nicht dabei: das Image `odoo`. Sein Tag enthaelt den Hash der
# requirements.txt.all des Projekts, es ist damit pro Kundenprojekt
# verschieden und laesst sich hier nicht vorbauen.
#
# Warum regelmaessig und nicht einmal: jede Aenderung an einem
# Image-Verzeichnis erzeugt neue Tags. Ab dann ist der vorgebaute Bestand
# wertlos und die Maschinen bauen wieder selbst -- ohne dass es auffaellt,
# denn die Instanzen kommen ja hoch, nur langsamer. Deshalb laeuft der Job bei
# jeder Aenderung an den Images und zusaetzlich woechentlich.

on:
  push:
    branches: [main]
    paths:
      - "postgres/**"
      - "proxy/**"
      - "cronjobs/**"
      - "pgbackrest/**"
      - "rsync/**"
      - "console/**"
      - "pgtools/**"
      - "offsite/**"
      - "dashboard/**"
      - "zodoo/src/zodoo/lib_zodoo_registry.py"
      - ".github/workflows/prebuild-images.yml"
  workflow_dispatch:
    inputs:
      versions:
        description: "Comma-separated Odoo versions (e.g. 17.0,19.0)"
        required: false
        default: "19.0"
        type: string
  schedule:
    # Montags vor der Arbeitszeit -- so ist der Bestand zu Wochenbeginn frisch.
    - cron: "0 3 * * 1"

# Ein Lauf zur Zeit. Der Merge des Workflows hat gleich drei Laeufe ausgeloest
# (Push auf main, manueller Start, Release) -- zwei davon bauen dieselben
# Images und pushen dieselben Tags. Verschwendete CI-Zeit im harmlosen Fall,
# zwei gleichzeitige Pushes auf denselben Tag im unguenstigen.
# cancel-in-progress bewusst NICHT: ein abgebrochener Lauf hinterlaesst
# halb hochgeladene Images, und der naechste faende sie vor.
concurrency:
  group: prebuild-images
  cancel-in-progress: false

jobs:
  prebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      VERSIONS: ${{ github.event.inputs.versions || '19.0' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pipx and gimera
        run: |
          python -m pip install --upgrade pip
          python -m pip install pipx
          pipx install gimera

      - name: Configure git identity (required for odoo init)
        run: |
          git config --global user.email "ci@zodoo.test"
          git config --global user.name "zodoo CI"
          git config --global init.defaultBranch main

      - name: Install zodoo (this checkout)
        run: |
          pipx install -e zodoo/src
          pipx environment --value PIPX_BIN_DIR >> "$GITHUB_PATH"
          # Die CLI erwartet die Images unter ~/.odoo/images. Kopie statt
          # Symlink: zodoo sucht Compose-Dateien mit `find` ohne -L und
          # ueberspringt verlinkte Baeume.
          mkdir -p "$HOME/.odoo/images"
          rsync -a --exclude='.git' "$GITHUB_WORKSPACE/" "$HOME/.odoo/images/"

      - name: Build and push generic images
        env:
          REGISTRY_URL: ${{ vars.ZODOO_REGISTRY_URL || 'registry.zebroo.de' }}
          REGISTRY_USERNAME: ${{ secrets.ZODOO_REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.ZODOO_REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${REGISTRY_USERNAME:-}" ] || [ -z "${REGISTRY_PASSWORD:-}" ]; then
            echo "::error::ZODOO_REGISTRY_USERNAME/PASSWORD fehlen als Secrets."
            echo "::error::Ohne Push-Zugang waere der Lauf reine Rechenzeit."
            exit 1
          fi

          # Docker HIER anmelden und nicht darauf vertrauen, dass zodoo es
          # tut.
          #
          # Warum: zodoo meldet sich an (login_with_settings_credentials) und
          # gibt "Stored registry credentials" aus -- am 31.08.2026 kamen die
          # Zugangsdaten trotzdem nicht am Registry an. Im Apache-Protokoll
          # sieht man den Unterschied: ein gesunder Push antwortet auf den
          # 401 mit einer Wiederholung, die den Benutzernamen traegt; die
          # Laeufe hier wiederholten nie. Auf einem gewoehnlichen Linux mit
          # denselben Zugangsdaten funktioniert derselbe Push.
          #
          # Eine Anmeldung mehr kostet nichts und nimmt eine Unbekannte aus
          # dem Ablauf. Die Zeile daneben zeigt, WAS docker gespeichert hat
          # -- nur die Schluessel, nie die Werte.
          echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY_URL" -u "$REGISTRY_USERNAME" --password-stdin
          python3 -c 'import json,os
          p = os.path.expanduser("~/.docker/config.json")
          c = json.load(open(p)) if os.path.exists(p) else {}
          for k, v in sorted(c.get("auths", {}).items()):
              print("  " + k + ": Felder=" + str(sorted(v))
                    + " auth-Wert gefuellt=" + str(bool(v.get("auth"))))
          print("credsStore:", c.get("credsStore") or "(keiner)")
          print("credHelpers:", c.get("credHelpers") or "(keine)")'

          # Direkter Push unmittelbar nach der Anmeldung.
          #
          # Trennt zwei Moeglichkeiten, die von aussen gleich aussehen: liegt
          # es an docker/Registry, scheitert schon dieser Push. Geht er
          # durch, liegt es an dem, was zwischen Anmeldung und zodoos Push
          # passiert -- und dann ist der Zugang unterwegs verlorengegangen.
          docker pull -q alpine:3.20 >/dev/null
          docker tag alpine:3.20 "$REGISTRY_URL/zodoo-probe:ci-$GITHUB_RUN_ID"
          if docker push "$REGISTRY_URL/zodoo-probe:ci-$GITHUB_RUN_ID"; then
            echo "PROBE: direkter Push GEHT"
          else
            echo "PROBE: direkter Push scheitert schon hier"
          fi

          # Nur die projektunabhaengigen Dienste. "odoo" fehlt hier bewusst
          # (Tag haengt am Projekt), ebenso alles, was ohnehin nicht auf einer
          # Kundenmaschine laeuft.
          #
          # cronjobshell, offsite und odoo_metrics_exporter kamen dazu: sie
          # laufen auf jeder Kundenmaschine, standen aber nicht in der Liste.
          # Gemessen am 28.08.2026 auf einer frisch aufgesetzten Instanz --
          # genau diese drei meldete zodoo als "not in zodoo registry" und
          # baute sie einzeln nach.
          SERVICES="postgres proxy cronjobs cronjobshell pgbackrest offsite"
          SERVICES="$SERVICES odoo_metrics_exporter rsync console pgtools"

          # Die Registry-Einstellungen gehoeren in die BENUTZER-Datei,
          # nicht nur ins Projekt.
          #
          # _get_push_credentials liest ZODOO_REGISTRY_SUGGESTED
          # ausschliesslich aus ~/.odoo/settings (_read_user_setting).
          # Benutzername und Passwort duerfen aus den Projekteinstellungen
          # kommen, dieser eine Schluessel nicht. Ist er leer und haengt kein
          # Terminal dran -- also in jeder CI -- steigt die Funktion
          # STILLSCHWEIGEND aus und laedt nichts hoch.
          #
          # Genau das ist am 28./29.08.2026 passiert: der Lauf war gruen, die
          # Images waren gebaut, die Tags stimmten mit denen der
          # Kundenmaschinen ueberein -- und in der Registry kam nichts an,
          # ohne eine einzige Zeile Ausgabe.
          mkdir -p "$HOME/.odoo"
          {
            echo "ZODOO_REGISTRY_URL=$REGISTRY_URL"
            echo "ZODOO_REGISTRY_USERNAME=$REGISTRY_USERNAME"
            echo "ZODOO_REGISTRY_PASSWORD=$REGISTRY_PASSWORD"
            echo "ZODOO_REGISTRY_SUGGESTED=1"
          } >> "$HOME/.odoo/settings"

          IFS=',' read -ra VERS <<< "$VERSIONS"
          for version in "${VERS[@]}"; do
            version="$(echo "$version" | xargs)"
            [ -n "$version" ] || continue
            echo "::group::Odoo $version"
            project="/tmp/prebuild-${version}"
            rm -rf "$project"
            # Ein Wegwerf-Projekt: gebraucht wird nur ein gueltiger
            # zodoo-Kontext, damit die Tags genauso berechnet werden wie
            # spaeter auf der Kundenmaschine.
            # Ausgeschrieben als "src init": die Kurzform "odoo init" haengt
            # an der Aufloesung abgekuerzter Befehle, und die kippte schon
            # einmal auf "offsite init" um. CI soll daran nicht haengen.
            odoo -f src init "$project" "$version" --ai none
            cd "$project"
            odoo setting "ZODOO_REGISTRY_URL=$REGISTRY_URL"
            odoo setting "ZODOO_REGISTRY_USERNAME=$REGISTRY_USERNAME"
            odoo setting "ZODOO_REGISTRY_PASSWORD=$REGISTRY_PASSWORD"
            odoo setting "ZODOO_REGISTRY_SUGGESTED=1"
            # Die Dienste muessen EINGESCHALTET sein, sonst schreibt "odoo
            # reload" sie gar nicht erst in die Compose-Datei -- und dann
            # bricht der Bau mit "could not find any target matching
            # 'pgbackrest'" ab. Genau daran ist dieser Ablauf seit dem
            # 24.08.2026 jedes Mal gescheitert, und weil er die Images
            # deshalb nie hochgeladen hat, musste sie jede Kundenmaschine
            # selbst bauen: rund neun Minuten pro Bestellung statt anderthalb.
            #
            # Hier eingeschaltet zu sein hat keine Nebenwirkung: das Projekt
            # ist ein Wegwerf-Kontext, gestartet wird nichts, gebraucht wird
            # nur die richtige Berechnung der Tags.
            odoo setting "RUN_PGBACKREST=1"
            odoo setting "RUN_OFFSITE=1"
            odoo setting "RUN_DASHBOARD=1"
            odoo reload
            # shellcheck disable=SC2086
            odoo build $SERVICES
            # shellcheck disable=SC2086
            odoo zodoo-push $SERVICES
            # Und dann warten, bis die Warteschlange WIRKLICH leer ist.
            #
            # "odoo build" laedt nicht selbst hoch: enqueue_registry_uploads
            # benennt das Image lokal um, legt einen Auftrag in
            # ${run}/jobqueue/ und startet einen ABGEKOPPELTEN Arbeiter. Auf
            # einem GitHub-Runner endet der Job unmittelbar danach, der
            # Arbeiter stirbt mit ihm -- und in der Registry kommt nichts an.
            #
            # Genau so gesehen am 28.08.2026: der Lauf war gruen, die
            # Tag-Liste der Registry danach unveraendert, und jede
            # Kundenmaschine baute die Images weiter selbst. run-crontab ist
            # der dafuer vorgesehene Notnagel und arbeitet die Warteschlange
            # im Vordergrund ab.
            odoo run-crontab
            # run-crontab allein reicht nicht: der abgekoppelte Arbeiter hat
            # die Auftraege in der Regel schon geklaut (sie heissen dann
            # <job>.json.processing.<pid>), und run-crontab meldet "processed
            # 0 job(s)", waehrend die Uploads noch laufen. Endet der Job
            # jetzt, stirbt der Arbeiter mitten im Push.
            #
            # Also auf das Verzeichnis warten, bis weder ein wartender noch
            # ein laufender Auftrag darin liegt.
            qdir="$HOME/.odoo/run/$(basename "$project" | tr '.' '_')/jobqueue"
            [ -d "$qdir" ] || qdir="$(find "$HOME/.odoo/run" -maxdepth 2 -type d -name jobqueue | head -1)"
            if [ -n "${qdir:-}" ] && [ -d "$qdir" ]; then
              for _ in $(seq 1 120); do
                offen=$(find "$qdir" -maxdepth 1 \
                  \( -name '*.json' -o -name '*.json.processing.*' \) | wc -l)
                [ "$offen" -eq 0 ] && break
                echo "warte auf $offen Upload(s) ..."
                sleep 10
              done
              odoo run-crontab
              uebrig=$(find "$qdir" -maxdepth 1 \
                \( -name '*.json' -o -name '*.json.processing.*' -o -name '*.failed.*' \) | wc -l)
              if [ "$uebrig" -ne 0 ]; then
                echo "::error::$uebrig Upload(s) nicht abgeschlossen -- die Images fehlen in der Registry."
                echo "--- docker-Zugang NACH dem Fehlschlag:"
                python3 -c 'import json,os
          p = os.path.expanduser("~/.docker/config.json")
          c = json.load(open(p)) if os.path.exists(p) else {}
          for k, v in sorted(c.get("auths", {}).items()):
              print("  " + k + ": Felder=" + str(sorted(v))
                    + " auth-Wert gefuellt=" + str(bool(v.get("auth"))))' || true
                find "$qdir" -maxdepth 1 -type f -printf '%f\\n' || true
                # Ohne die Protokolle des Arbeiters raet man hinterher, woran
                # es lag -- und der Runner ist dann weg.
                for f in "$qdir"/log/*; do
                  [ -f "$f" ] || continue
                  echo "----- $(basename "$f")"
                  tail -40 "$f"
                done
                exit 1
              fi
            fi
            cd /
            rm -rf "$project"
            echo "::endgroup::"
          done
