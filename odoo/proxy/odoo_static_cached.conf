# proxy_host: odoo:8069

location ^~ /web/static/ {

    # set $backend http://odoo:8069;
    # access_by_lua_file "{lua_resolve_host}";

    proxy_pass http://odoo:8069;

    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # done in lua with fallback option (called from outside)
    #proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $external_port;
    proxy_set_header X-Real-IP $remote_addr;

    proxy_connect_timeout   600;
    proxy_send_timeout      600;
    proxy_read_timeout      600;

    proxy_set_header X-NginX-Proxy true;
    error_page 502 503 504 =503 @fallback;

    # CACHING
    proxy_cache odoo_cache;
    proxy_cache_valid 200 10m;
    proxy_ignore_headers Cache-Control Expires Set-Cookie;
    proxy_hide_header Set-Cookie;
    add_header X-Cache-Status $upstream_cache_status;

    expires 2h;
    add_header Cache-Control "public, max-age=7200, immutable" always;
}

