# manage-order 999
services:
  odoo_base:
    build:
      context: ${HOST_RUN_DIR}/build.odoo
      dockerfile: $ODOO_IMAGES/odoo/config/${ODOO_VERSION_INT}/Dockerfile
      args:
        ODOO_VERSION: "${ODOO_VERSION_INT}"
        ODOO_CONFIG_DIR: ${ODOO_CONFIG_DIR}
        ODOO_PYTHON_VERSION: ${ODOO_PYTHON_VERSION}
    restart: unless-stopped
    labels:
      proxy_lua_template: ${ODOO_IMAGES}/odoo/proxy/template.lua
    profiles:
      - auto
    volumes:
      - ${HOST_RUN_DIR}:/opt/run
      - ${HOST_RUN_DIR}/odoo_outdir:/opt/out_dir
      - ${HOST_RUN_DIR}/debug:/tmp/debug
      - ${ODOO_FILES}:/opt/files
      - ${HOST_RUN_DIR}/proxy_exchange:/var/run/proxy_exchange
      - ${HOST_RUN_DIR}/odoo-shell-ipython:/home/odoo/.ipython
      # zodoo CLI source — bind-mounted at runtime so source-only changes
      # don't require image rebuilds. Bakery images (ZODOO_EMBED=1) ignore
      # this since they ship via k8s without docker-compose; locally a
      # bakery rebuild can use ./.odoo/run/<project>/docker-compose.yml that
      # the composer regenerates with this volume stripped.
      - ${ODOO_IMAGES}/zodoo/src:/opt/zodoo:rw
