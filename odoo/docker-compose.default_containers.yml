# manage-order 1001
services:
  odoo:
    labels:
      odoo.web_container: "1"
      compose.merge: "odoo_base"
      proxy_config: ${ODOO_IMAGES}/odoo/proxy/odoo.conf
      proxy_config_chat: ${ODOO_IMAGES}/odoo/proxy/odoo_chat.conf
    environment:
      IS_ODOO_WEBSERVER: 1
      DEBUGGER_WATCH: /opt/src/.debug
      DEBUGGER_ODOO_PID: /tmp/odoo.debug.pid
    # No healthcheck — the in-container supervisor watches the cronjobs and
    # queuejobs roles itself and respawns just those subprocesses when they
    # get stuck (DB connection loss, cron thread crash, …). A full
    # `docker restart` would also take the web role down with it, so we
    # keep it role-local. See `_WATCHDOG_PATTERNS` in
    # [supervisor.py](../bin/supervisor.py).

  # odoo_debug reuses the `odoo` image directly (no separate build) — the
  # explicit `image:` short-circuits compose's default `<proj>-<service>`
  # tag and keeps "only one odoo image" true. Lives behind the `manual`
  # profile so `odoo up` does not start it; spun up on demand by
  # `odoo debug odoo_debug` (see zodoo.lib_control_with_docker.debug).
  odoo_debug:
    profiles:
      - manual
    image: ${COMPOSE_PROJECT_NAME}-odoo:latest
    restart: "no"
    labels:
      compose.merge: "odoo_base"
    environment:
      ENDLESS_LOOP: 1
      DEBUGGER_WATCH: /opt/src/.debug
      DEBUGGER_ODOO_PID: /tmp/odoo.debug.pid
