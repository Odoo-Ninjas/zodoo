# Increment to force a re-pull from the zebroo registry (e.g. after major infra changes).
generation: 1
settings:
  - ODOO_PYTHON_VERSION
tag_prefix:
  - odoo_version
  - ODOO_PYTHON_VERSION
include_requirements_hash: true
extra_paths:
  - odoo/config/${odoo_version_int}/Dockerfile
  - odoo/config/common.docker
  - odoo/bin
# Only hash the zodoo source files that actually run inside the container.
# Full zodoo/src/ is too broad — CLI-only changes should not invalidate the image.
includes_zodoo: false
zodoo_paths:
  - zodoo/src/zodoo/lib_module.py
  - zodoo/src/zodoo/module_tools.py
  - zodoo/src/zodoo/odoo_config.py
  - zodoo/src/zodoo/tools.py
# Files relative to the project WORKING_DIR whose content affects the build.
project_files:
  - requirements.txt.all
# Glob patterns relative to WORKING_DIR (custom Dockerfiles in the project).
project_globs:
  - "**/Dockerfile.appendix"
