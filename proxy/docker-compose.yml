#manage-order: 5000
volumes:
  # shared with the dashboard's Alloy collector: the nginx JSON access log.
  # Declared here (proxy always runs) so the mount is valid even when the
  # dashboard service is disabled.
  dashboard_nginx_logs:

services:
  proxy_abstract:
    build: $ODOO_IMAGES/proxy
    restart: unless-stopped
    profiles:
      - auto
    networks:
      - default
    environment:
      - LUA_DIR=/usr/local/openresty/nginx/lua
      - CONF_DIR=/usr/local/openresty/nginx/conf.d
      - LUA_TEMPLATE=/opt/template.lua
      - PROXY_EXCHANGE=/var/proxy_exchange
      - CONSTRUCTION_SITE_PORT=3333
      - WARMUP_PROXY_HOLD_S=${WARMUP_PROXY_HOLD_S:-120}
    volumes:
      - $HOST_RUN_DIR/proxy_exchange:/var/proxy_exchange
      - $HOST_RUN_DIR/proxy:/etc/proxy
      - $HOST_RUN_DIR/run/intercom:/intercom
      - ${HOST_RUN_DIR}/odoo_outdir/robot_output:/robot_output
      - ${HOST_RUN_DIR}/proxy_logs:/root/.npm/_logs
      - $ODOO_IMAGES/proxy/static:/usr/local/openresty/nginx/static:ro
      - $ODOO_IMAGES/proxy/lua/template.lua:/opt/template.lua
      - ${ODOO_IMAGES}/proxy/lua/myngx.lua:/usr/local/openresty/luajit/share/lua/5.1/myngx.lua
      - dashboard_nginx_logs:/var/log/nginx

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
