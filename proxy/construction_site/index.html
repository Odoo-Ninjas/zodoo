<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Maintenance</title>
    <style>
      :root {
        --primary: #875a7b;
        --bg: #111118;
        --text: #ffffff;
        --muted: rgba(255, 255, 255, 0.65);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family:
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        background: var(--bg);
        color: var(--text);
        text-align: center;
        padding: 24px;
      }

      .container {
        max-width: 480px;
      }

      h1 {
        font-size: 32px;
        margin: 0 0 12px;
        font-weight: 600;
      }

      p {
        margin: 0 0 24px;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.5;
      }

      .spinner {
        width: 48px;
        height: 48px;
        margin: 0 auto 20px;
        border-radius: 50%;
        border: 4px solid rgba(255, 255, 255, 0.15);
        border-top-color: var(--primary);
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .hint {
        font-size: 13px;
        color: rgba(255, 255, 255, 0.45);
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="spinner" aria-hidden="true"></div>
      <h1>System is being updated</h1>
      <p>
        We’re currently performing maintenance. The service will be available
        again shortly.
      </p>
      <div class="hint">Please refresh this page in a few minutes.</div>
    </div>
  </body>
</html>
