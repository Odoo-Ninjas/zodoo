worker_processes auto;
include /etc/envvars.conf;

events {
    worker_connections 1024;
}


http {
    resolver 127.0.0.11 valid=10s ipv6=off;
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=odoo_cache:50m max_size=2g inactive=60m use_temp_path=off;

    # map $http_upgrade $connection_upgrade {
    #     default upgrade; # If the client sends Upgrade: something → keep it as upgrade
    #     ''      close;   # If there's no Upgrade header → close
    # }
    include       mime.types;
    default_type  application/octet-stream;
    log_format debuglog 'host=$host http_host=$http_host server_port=$server_port scheme=$scheme proxy_add_x_forwarded_for=$proxy_add_x_forwarded_for';

    error_log /dev/stderr info;
    #access_log /dev/stdout debuglog;
    access_log /dev/stdout;

    upstream fallback_backend {
        server 127.0.0.1:8080; # A simple maintenance page or dummy server
    }

    # http{}-Block
    # identify external port to have correct url redirections example:
    # http://stratoserver1:10000/cicd/web/ to /cicd/web/login
    map $scheme $default_port {
        http  80;
        https 443;
    }

    map $http_host $external_port {
        ~:(?<p>\d+)$  $p;            # wenn Host: example.com:10000 -> 10000
        default       $default_port; # sonst 80/443 je nach Schema
    }

	# GZIP
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;

    gzip_types
    text/plain text/css text/xml application/xml application/json
    application/javascript application/x-javascript
    image/svg+xml font/ttf font/otf application/vnd.ms-fontobject;

    server {
        listen 8080;
        location / {
            root  /usr/local/openresty/nginx/static;
        }
        error_page 404 /custom_50x.html;
    }

    # Set up a simple server
    server {
        listen 80;
        proxy_intercept_errors on;

        set $default_target "http://127.0.0.1:8080";

        # Fallback location
        location @fallback {
            proxy_pass http://fallback_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Include additional location directives
        include /usr/local/openresty/nginx/conf.d/*.conf;

        # Increase timeouts (useful for long-running requests)
        proxy_read_timeout 7200;
        proxy_connect_timeout 7200s;
        proxy_send_timeout 7200s;

        # Client max body size (for file uploads)
        client_max_body_size 10000M;
    }

	# update flag und construction site
    lua_shared_dict flags 1m;

    init_worker_by_lua_block {
        local dict = ngx.shared.flags
        local path = "/var/proxy_exchange/odoo_update"

        local function check(premature)
            if premature then
                return
            end


            local f, err = io.open(path, "r")
            if f then
                local enabled = false
                local content = f:read("*l")   -- erste Zeile lesen
                f:close()

                if content then
                    content = content:match("^%s*(.-)%s*$")  -- trim whitespace
                    if content == "1" then
                        enabled = true
                    end
                end
                -- Datei löschen (nur wenn sie existierte)
                local ok, rm_err = os.remove(path)
                if not ok then
                    ngx.log(ngx.ERR, "failed to remove switch file: ", rm_err)
                end
                dict:set("odoo_update", enabled)
            end

        end

        -- initial prüfen
        check(false)

        -- jede Sekunde neu prüfen
        if ngx.worker.id() == 0 then
            local ok, err = ngx.timer.every(1, check)
            if not ok then
                ngx.log(ngx.ERR, "failed to start timer: ", err)
            end
        end
    }
}
