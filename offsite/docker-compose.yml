# manage-order: 520
volumes:
  # The restic cache (an index of the blocks already transferred) makes the
  # difference between "deduplicated and incremental" and "reads everything
  # again every night" - it has to survive across runs.
  offsite_cache:
  # Declared here as well, not only in barman/docker-compose.yml: with
  # RUN_BARMAN=0 the barman compose file is not part of the merge at all, and a
  # volume reference into nothing makes `docker compose config` fail. This way
  # the source is simply empty when barman is switched off.
  barman_data:
services:
  offsite:
    build:
      context: $ODOO_IMAGES/offsite
    profiles:
      # Not a long-running service: the container is started once per backup
      # (`odoo offsite ...` or the nightly cronjob) and exits again. As an
      # "auto" service `odoo up -d` would start it and the immediate exit would
      # look like a crash.
      - manual
    environment:
      OFFSITE_REPO: $OFFSITE_REPO
      OFFSITE_PASSPHRASE: $OFFSITE_PASSPHRASE
      # Access to the area on the backup server (rest: targets).
      OFFSITE_REST_USER: $OFFSITE_REST_USER
      OFFSITE_REST_PASSWORD: $OFFSITE_REST_PASSWORD
      OFFSITE_KEEP_DAILY: $OFFSITE_KEEP_DAILY
      OFFSITE_KEEP_WEEKLY: $OFFSITE_KEEP_WEEKLY
      OFFSITE_KEEP_MONTHLY: $OFFSITE_KEEP_MONTHLY
      OFFSITE_COMPRESSION: $OFFSITE_COMPRESSION
      OFFSITE_UPLOAD_LIMIT: $OFFSITE_UPLOAD_LIMIT
      OFFSITE_INCLUDE_DUMPS: $OFFSITE_INCLUDE_DUMPS
      OFFSITE_ALLOW_WITHOUT_DB: $OFFSITE_ALLOW_WITHOUT_DB
      OFFSITE_ALLOW_WITHOUT_FILES: $OFFSITE_ALLOW_WITHOUT_FILES
      OFFSITE_LAYOUT: $OFFSITE_LAYOUT
      # Set per run by `odoo offsite backup` (docker compose run -e) when a
      # fresh dump was pulled because barman is off. Declared here only so the
      # variable exists inside the container at all.
      OFFSITE_DB_DUMP: ""
      PROJECT_NAME: $PROJECT_NAME
      # Selects this database's filestore subdirectory out of the host-wide
      # pool (see entrypoint.sh).
      DBNAME: $DBNAME
    volumes:
      # All sources read-only: this container reads backups, it does not
      # produce any, and it must not touch production data under any
      # circumstances.
      - barman_data:/source/barman:ro
      - $ODOO_FILES:/source/filestore:ro
      - $DUMPS_PATH:/source/dumps:ro
      - offsite_cache:/var/lib/restic
      # A fixed path rather than a setting: settings values are not expanded
      # recursively, so a "$HOST_RUN_DIR/offsite" from default.settings would
      # arrive here literally and compose would read it as a volume NAME.
      - $HOST_RUN_DIR/offsite:/etc/offsite:ro
