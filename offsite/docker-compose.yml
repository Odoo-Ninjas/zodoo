# manage-order: 520
volumes:
  # Der restic-Cache (Index der bereits uebertragenen Bloecke) macht den
  # Unterschied zwischen "dedupliziert inkrementell" und "liest jede Nacht alles
  # neu ein" - er muss ueber Laeufe hinweg bestehen bleiben.
  offsite_cache:
  # Auch hier deklariert, nicht nur in barman/docker-compose.yml: bei
  # RUN_BARMAN=0 ist die Barman-Compose gar nicht Teil des Merges, und ein
  # Volume-Verweis ins Leere laesst `docker compose config` scheitern. So
  # bleibt die Quelle bei abgeschaltetem Barman einfach leer.
  barman_data:
services:
  offsite:
    build:
      context: $ODOO_IMAGES/offsite
    profiles:
      # Kein Dauerlaeufer: der Container wird pro Backup einmal gestartet
      # (`odoo offsite ...` bzw. der naechtliche Cronjob) und beendet sich
      # wieder. Als "auto"-Service wuerde `odoo up -d` ihn starten und der
      # sofortige Exit saehe wie ein Absturz aus.
      - manual
    environment:
      OFFSITE_REPO: $OFFSITE_REPO
      OFFSITE_PASSPHRASE: $OFFSITE_PASSPHRASE
      # Zugang zum Bereich auf dem Backup-Server (rest:-Ziele).
      OFFSITE_REST_USER: $OFFSITE_REST_USER
      OFFSITE_REST_PASSWORD: $OFFSITE_REST_PASSWORD
      OFFSITE_KEEP_DAILY: $OFFSITE_KEEP_DAILY
      OFFSITE_KEEP_WEEKLY: $OFFSITE_KEEP_WEEKLY
      OFFSITE_KEEP_MONTHLY: $OFFSITE_KEEP_MONTHLY
      OFFSITE_COMPRESSION: $OFFSITE_COMPRESSION
      OFFSITE_UPLOAD_LIMIT: $OFFSITE_UPLOAD_LIMIT
      OFFSITE_INCLUDE_DUMPS: $OFFSITE_INCLUDE_DUMPS
      OFFSITE_ALLOW_WITHOUT_DB: $OFFSITE_ALLOW_WITHOUT_DB
      # Wird pro Lauf von `odoo offsite backup` gesetzt (docker compose run -e),
      # wenn ohne Barman ein frischer Dump gezogen wurde. Hier nur deklariert,
      # damit die Variable im Container ueberhaupt existiert.
      OFFSITE_DB_DUMP: ""
      PROJECT_NAME: $PROJECT_NAME
      # Waehlt den Filestore-Unterordner dieser Datenbank aus dem host-weiten
      # Pool aus (siehe entrypoint.sh).
      DBNAME: $DBNAME
    volumes:
      # Alle Quellen read-only: dieser Container liest Backups, er erzeugt
      # keine und darf produktive Daten unter keinen Umstaenden anfassen.
      - barman_data:/source/barman:ro
      - $ODOO_FILES:/source/filestore:ro
      - $DUMPS_PATH:/source/dumps:ro
      - offsite_cache:/var/lib/restic
      # Fester Pfad statt Setting: Settings-Werte werden nicht rekursiv
      # expandiert, ein "$HOST_RUN_DIR/offsite" aus default.settings kaeme hier
      # woertlich an und compose wuerde es als Volume-NAMEN lesen.
      - $HOST_RUN_DIR/offsite:/etc/offsite:ro
