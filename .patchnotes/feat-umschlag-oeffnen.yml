type: feature
breaking: false
description: |
  Neuer Befehl `odoo pgbackrest envelope`: oeffnet einen age-Umschlag und gibt
  ein Feld aus - der Weg, eine Passphrase zurueckzubekommen.

  Hintergrund: `umschlag_oeffnen()` gab es schon, aber nur als Funktion, die
  der Pruefstand benutzt. Um von Hand an eine Passphrase zu kommen, musste man
  Python schreiben. Deshalb hat niemand den Umschlag als Ablageort betrachtet -
  und deshalb wurde die Passphrase zusaetzlich im Klartext gehalten, unter
  anderem in einem Odoo-Feld.

  Zum Ausprobieren, auf dem Pruefstand:

    odoo pgbackrest envelope --area <bereich> \
      --bench-config /etc/pgbr-pruefstand/config.json

  gibt die Passphrase roh auf stdout aus, damit sie sich weiterverwenden
  laesst. `--field` waehlt ein anderes Feld, `--list-fields` zeigt die NAMEN
  ohne Werte.

  Worauf zu achten ist - der eigentliche Entwurfspunkt: der Befehl geht auch
  OHNE Pruefstand.

    odoo pgbackrest envelope --file <umschlag.age> --age-key <schluessel>

  Im Ernstfall ist der Pruefstand vielleicht genau das, was fehlt. Dann hat
  man den Schluessel aus dem Tresor und den Umschlag von irgendwo - aus dem
  Anhang am Projekt in hosting.zebroo.de, von der Backup-Maschine, aus dem
  Zweitbestand - und braucht sonst nichts.

  Fehlt der Schluessel, sagt der Befehl, wo er liegt (Pruefstand bzw.
  1Password-Item). Fehlt ein Feld, nennt er die vorhandenen NAMEN - nie die
  Werte. Es wird nichts protokolliert: ein Geheimnis gehoert in kein Logfile.
