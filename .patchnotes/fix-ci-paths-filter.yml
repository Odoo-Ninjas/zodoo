type: internal
breaking: false
description: |
  Die automatischen Tests laufen jetzt bei jeder Aenderung, nicht nur bei
  bestimmten Verzeichnissen.

  Die Unit-Tests waren auf Aenderungen unter zodoo/src beschraenkt. Das klingt
  vernuenftig, hatte aber eine Luecke: die Tests liegen zwar dort, pruefen von
  dort aus aber auch Dateien ausserhalb - test_cronjobs_run laedt
  cronjobs/bin/run.py, test_router_vhost_wizard laedt
  router_global/render_configs.py. Wer genau die Datei aenderte, die ein Test
  prueft, bekam diesen Test also nicht zu sehen. Insgesamt liefen bei
  Aenderungen an cronjobs, router_global, common_snippets, proxy, console,
  install.sh und einem guten Dutzend weiterer Verzeichnisse gar keine Tests.

  Dramatisch war das nie, weil nach dem Zusammenfuehren auf main ohnehin alles
  laeuft - nur eben zu spaet: der Fehler faellt dann erst danach auf und
  blockiert die Auslieferung, statt vorher im Vorschlag aufzutauchen.

  Der Filter der Unit-Tests ist deshalb ersatzlos weg; die Suite braucht keine
  Minute. Beim schweren Docker-Durchlauf, der eine Viertelstunde dauert, bleibt
  ein Filter sinnvoll - er umfasst jetzt zusaetzlich common_snippets und
  cronjobs, weil beides direkt in die Abbilder geht (common_snippets/zodoo baut
  das venv jedes Containers, cronjobs stellt den Cron-Daemon der Instanz).

  Zum Nachschauen: einen Vorschlag aufmachen, der nur eine Datei ausserhalb von
  zodoo/src aendert (etwa in docs/ oder router_global/) - unter den Pruefungen
  muessen jetzt die unit-Eintraege fuer alle Python-Versionen auftauchen.
