type: fix
breaking: false
description: |
  `odoo offsite backup` sichert jetzt auch dann, wenn nur EIN Strom
  write-only konfiguriert ist. Bisher hat es in dem Fall gar nichts gesichert
  und trotzdem Erfolg gemeldet.

  Hintergrund: die Weiche verlangte `wo_files && wo_db` - also dass BEIDE
  Stroeme (Filestore und Datenbank) ein write-only Ziel haben. Unser
  Normalaufbau ist aber ein anderer: die Datenbank geht ueber pgBackRest,
  nur der Filestore geht offsite. `OFFSITE_WO_DB_RECIPIENT` ist dann
  absichtlich leer. Damit fiel der Lauf durch auf die Pruefung von
  `OFFSITE_REPO`, die im write-only Aufbau ebenfalls leer ist - und stieg mit
  einer Meldung auf stdout und Rueckgabewert 0 aus.

  Der naechtliche Cronjob (`CRONJOB_OFFSITE_BACKUP`, 04:00) hat das jede
  Nacht getan und jedes Mal Erfolg gemeldet. Aufgefallen ist es nur daran,
  dass die angemeldeten Bereiche auf dem Backup-Server nach Tagen noch
  0 Dateien hatten - beide Instanzen, seit dem 01. bzw. 02.09.2026, kein
  einziger PUT beim Empfaenger. Der Filestore war die ganze Zeit vollstaendig
  konfiguriert; er wurde nur nie angefasst.

  Neu:

  - Ist nur der Filestore write-only und die Datenbank liegt bei pgBackRest
    (`RUN_PGBACKREST=1`), laeuft der Filestore-Strom. Kein restic, keine
    Passphrase noetig.
  - Ist nur der Filestore write-only und die Datenbank ist durch NICHTS
    gedeckt, bricht der Lauf ab. Die Anhaenge allein hochzuladen sieht aus
    wie ein Backup und ist keins.
  - `RUN_OFFSITE=1` ohne jedes Ziel ist jetzt ein FEHLER statt eines stillen
    Erfolgs. Wer ein Offsite-Backup anfordert und keins bekommt, soll das
    merken. Der leise Fall bleibt `RUN_OFFSITE=0` - der steigt weiter
    wortlos aus, damit Projekte ohne Offsite-Ziel nicht jede Nacht einen
    Cron-Fehler melden.

  Worauf beim Testen zu achten ist: auf einer Instanz mit pgBackRest und
  angemeldetem Filestore-Ziel `odoo offsite backup` von Hand starten. Danach
  muessen im Bereich auf dem Backup-Server Objekte liegen (vorher 0 Dateien).
  Wer ein `RUN_OFFSITE=1` ohne Ziel stehen hat, bekommt ab jetzt jede Nacht
  einen Cron-Fehler - das ist beabsichtigt und weist auf eine unfertige
  Anmeldung hin.
