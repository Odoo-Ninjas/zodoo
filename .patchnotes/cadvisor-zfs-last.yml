type: bugfix
breaking: false
description: |
  cadvisor verbrennt auf Hosts mit Docker-zfs-Storage-Driver nicht mehr
  dauerhaft einen ganzen CPU-Kern pro Instanz.

  Hintergrund: fuer die Dateisystem-Metriken pro Container fragt cadvisor ZFS
  ab und iteriert dabei ueber tausende Layer-Datasets. Neben dem
  cadvisor-Prozess selbst haengen zwei zfs-Prozesse mit je 100 Prozent CPU
  daran, und zwar rund um die Uhr. Gemessen auf hy-odooprod: 7 Tage 14 h
  CPU-Zeit in 13 Tagen Laufzeit. Mit zwei Instanzen mit Dashboard-Stack lag die
  Maschine bei Load 14 statt der ueblichen 2,5, und SSH-Verbindungen brachen
  zeitweise weg. Aufgefallen ist es erst nach 13 Tagen - solange nichts
  ausfaellt, sieht niemand auf die Last.

  Der cadvisor-Container bekommt deshalb vier Argumente mit:

    --disable_metrics=disk,diskIO     container_fs_* und container_blkio_* raus
    --housekeeping_interval=30s       Default war 1s
    --docker_only=true                keine fremden cgroups scannen
    --store_container_labels=false    weniger Kardinalitaet

  Zum Nachsehen, auf einem Host mit Dashboard-Stack:

    docker stats --no-stream <projekt>_cadvisor
    pgrep -c zfs

  Erwartet werden 0,8 bis 3 Prozent CPU statt der bisherigen 100+ Prozent, und
  keine dauerhaften zfs-Prozesse mehr. Wer es genauer will, vergleicht die
  CPU-Zeit ueber einige Minuten:

    ps -o etime=,time= -p $(docker inspect <projekt>_cadvisor -f '{{.State.Pid}}')

  Worauf zu achten ist: in zodoo-overview.json bleiben die beiden Panels leer,
  die container_fs_reads_bytes_total und container_fs_writes_bytes_total
  abfragen. Die uebrigen vier Panels (CPU, Speicher, Netz rein/raus) haben
  weiter Daten, das Prometheus-Target bleibt up.

  Das ist bewusst so: den Pool-Fuellstand und die ZFS-Statistik liefert der
  node_exporter ohnehin, mit node_filesystem_* und 266 node_zfs_*-Metriken -
  und das ist die Ebene, auf der Kapazitaet entschieden wird. Der Verbrauch pro
  Container-Layer ist dafuer redundant und war der teuerste Teil der Messung.

  Wer die beiden Panels wirklich braucht, kann disk/diskIO fuer eine einzelne
  Instanz wieder zulassen und nur das Housekeeping-Intervall stehen lassen -
  dann bleibt die ZFS-Iteration aber grundsaetzlich bestehen.
