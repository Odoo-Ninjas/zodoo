type: minor
description: |
  Postgres zieht den pgBackRest-Sidecar beim Start mit hoch. Ohne das scheiterte
  die WAL-Archivierung dauerhaft, wenn jemand postgres allein startete
  (`docker compose up -d postgres`, ein Teil-Neustart, `odoo db reset`) - die
  Stanza legt naemlich der Sidecar an. Gemeldet hat sich dabei nichts: postgres
  lief weiter, das WAL staute sich, und die Sicherung, die alle fuer vorhanden
  hielten, gab es nicht.

  Zum Testen: `odoo up -d postgres` auf einem Projekt mit RUN_PGBACKREST=1 - es
  muss der Sidecar mit hochkommen. Danach `odoo pgbackrest check`: die
  WAL-Archivierung muss durchlaufen.
breaking: false
