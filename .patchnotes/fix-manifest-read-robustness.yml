type: fix
description: "Ein MANIFEST, das gerade von einem anderen Prozess (rsync aus dem geteilten CI-Cache, git checkout, gimera) neu geschrieben wird, liest sich kurzzeitig leer — und brach damit bisher nach ~1 Sekunde den ganzen Befehl ab. Die Meldung war 'Could not parse ' ohne Inhalt, und der Abbruch tauchte danach als voelig anderer Fehler wieder auf (z.B. 'somehow dbname is missing' beim restore), was in CI-Logs praktisch nicht diagnostizierbar war. Ein leer/unvollstaendig gelesenes MANIFEST wird jetzt mit exponentiellem Backoff bis zu 15 Sekunden erneut gelesen (ueber ZODOO_MANIFEST_READ_TIMEOUT einstellbar); ein gar nicht vorhandenes MANIFEST kehrt sofort zurueck, statt das Budget zu verbrauchen, und ein MANIFEST ohne 'addons_paths' behaelt seine kurze Wartezeit (der Lesepfad laeuft bei jedem Zugriff, darf also nicht langsamer werden). Gibt zodoo doch auf, nennt die Meldung nun Pfad, Dateigroesse, Wartezeit und den tatsaechlich gesehenen Inhalt. Zusaetzlich raeumt 'robot run' den Selenium-Container jetzt best-effort ab: ein Fehler beim Herunterfahren kann das Testergebnis nicht mehr ueberschreiben — bisher wurde ein Lauf, dessen Tests alle bestanden hatten, dadurch als fehlgeschlagen gemeldet."
breaking: false
