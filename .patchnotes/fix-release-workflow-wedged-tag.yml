type: fix
description: "release workflow: releases are no longer silently blocked, and patchnotes in subfolders reach the CHANGELOG. Three defects, all of which hid each other: (1) the push used 'git push origin main --tags', which is not atomic — when branch protection rejected main the tag was still pushed, leaving a tag whose release commit never landed on main; that is how v7.1.0 became an orphan while main stayed on 7.0.0. Now pushed with --atomic, so main and tag land together or not at all. (2) Every later run then recomputed the same version from the unchanged VERSION plus the still-present patchnotes, found the existing tag and did 'exit 0' — the job reported success, 'Create GitHub Release' was skipped, and no release was cut for weeks behind a green check. The step now only skips quietly when the tag is an ancestor of main (a genuine re-run) and fails loudly with an explanation otherwise. (3) The changelog loop globbed '.patchnotes/*.yml' (top level only) while the cleanup deleted with 'find .patchnotes -name *.yml -delete' (recursive), so notes in subfolders such as .patchnotes/fix/ were deleted without ever appearing in the CHANGELOG. Collection is recursive now. main has been reconciled with the v7.1.0 tag and the two notes lost that way have been restored."
breaking: false
