type: feature
description: 'Neuer Befehl `odoo backup-metrics`: schreibt Kennzahlen zur Sicherung fuer den textfile-Collector des node_exporter, damit ein Ausfall der Sicherung in der Ueberwachung auffaellt (alle fuenf Minuten aus den Cronjobs, CRONJOB_BACKUP_METRICS). Eine Instanz, deren Sicherung nicht laeuft, sieht von aussen aus wie jede andere -- sie antwortet, die Kurven sind gruen, und der Unterschied faellt genau einmal auf: an dem Tag, an dem jemand wiederherstellen will. Ausgegeben werden zodoo_backup_enabled{art}, zodoo_backup_query_success{art}, zodoo_backup_count{art}, zodoo_backup_last_success_timestamp_seconds{art} und zodoo_backup_last_full_timestamp_seconds{art}. Bewusst der ZEITPUNKT und nicht das Alter: das Alter bildet man mit time() - <wert> und es altert damit auch dann weiter, wenn der Schreiber selbst nicht mehr laeuft -- eine vorberechnete Alterszahl stuende dann fuer immer still auf ihrem letzten Wert und saehe gesund aus. Dagegen steht ausserdem zodoo_backup_metrics_written_timestamp_seconds. Gibt es gar keine Sicherung, fehlt die Zeitpunkt-Zeile statt auf 0 zu stehen (eine 0 hiesse "1970 gesichert"); in PromQL greift dafuer absent(). Fuer offsite steht nur enabled drin, einen verlaesslichen Zeitpunkt gibt es dort nicht. Zum Testen: `odoo backup-metrics --stdout` zeigt ohne zu schreiben, was die Ueberwachung ueber die Instanz erfaehrt.'
breaking: false
