type: minor
description: |
  Neu: `odoo pgbackrest register` meldet eine Instanz beim Backup-Server an.
  Der erste Aufruf stellt eine Anfrage, ein Admin gibt sie in der Maske des
  Anmeldedienstes frei, der zweite Aufruf holt Stanza, Client-Zertifikat und
  Passphrase ab und traegt alles in die Settings ein. Danach nur noch
  `odoo reload && odoo up -d && odoo pgbackrest check`.

  Zum Testen: auf einer Instanz mit VPN-Zugang zum Backup-Server
  `odoo pgbackrest register` aufrufen. Beim ersten Kontakt wird der
  Fingerabdruck der CA angezeigt - der gehoert einmal gegen den Server
  geprueft. Erwartet: die Zugangsdaten werden genau EINMAL herausgegeben,
  ein zweiter Abholversuch liefert "delivered" und nichts weiter.

  Eine Freigabe deckt beide Stroeme ab: Datenbank (pgBackRest) und Filestore
  (write-only Empfaenger). Liefert der Server keinen oeffentlichen age-Schluessel,
  bleibt der Filestore-Strom absichtlich AUS - sonst gingen Anhaenge im Klartext
  raus.
breaking: false
