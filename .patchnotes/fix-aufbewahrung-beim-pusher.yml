type: bugfix
breaking: true
description: |
  Die Aufbewahrung wird jetzt auch dann in die pgbackrest.conf der Instanz
  geschrieben, wenn gegen einen Repo-Host gesichert wird (BACKUP_FROM=here).
  Vorher blieb sie dort weg - und lief damit NIRGENDS.

  Hintergrund: die Begruendung war, die Aufbewahrung gehoere der Maschine, der
  die Platte gehoert, und der Backup-Server fahre seinen eigenen `expire`. Das
  klingt richtig und funktioniert bei einem VERSCHLUeSSELTEN Repository nicht:
  `expire` muss `backup.info` lesen, und die ist clientseitig verschluesselt.
  Auf dem Repo-Host endet der Versuch mit
  `FormatError: key/value found outside of section at line 1: Salted__...` -
  genauso wie `verify`. Dass er die Datei nicht oeffnen kann, ist der Sinn des
  Aufbaus und kein Mangel.

  Folge bis 2026-08-31: kein einziger `expire` lief, der Bestand wuchs
  unbegrenzt, und die Dokumentation versprach 14 Tage. Genau der Fehler, vor
  dem der Kommentar in `_retention_lines` seit jeher warnt - eine Aufraeumung,
  die eingerichtet, aber nie wirksam war.

  ACHTUNG, das ist der breaking-Teil: nach `odoo reload && odoo up -d` beginnt
  die Instanz, Sicherungen aelter als `PGBR_RETENTION_FULL` (Vorgabe 14 Tage)
  zu entfernen - beim naechsten Sicherungslauf, denn pgBackRest laesst `expire`
  ohnehin mitlaufen. Wer laenger vorhalten will, setzt die Zahl VORHER.
  Empfehlung: einmal `odoo pgbackrest info` ansehen und pruefen, was
  wegfaellt.

  Neue Loeschbefugnis entsteht dadurch nicht: `odoo pgbackrest expire` gibt es
  auf der Instanz laengst, und der unveraenderliche Zweitbestand nimmt an
  einem `expire` ohnehin nicht teil - dort wird nichts geloescht.

  Bei `BACKUP_FROM=repo-host` (der Server zieht) bleibt die Aufbewahrung
  weiterhin drueben; dort weist der Reload jetzt darauf hin, dass sie mit
  einem verschluesselten Repository nicht durchsetzbar ist.
