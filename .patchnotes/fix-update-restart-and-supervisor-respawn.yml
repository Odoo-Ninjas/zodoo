type: fix
description: 'Ein `odoo update`, das die Container vorher komplett heruntergenommen hat (cicd im Devmode killt das ganze Compose-Projekt) und danach frueh aussteigt ("No module update required"), liess die Instanz einfach aus: die drei Rollen-Starts liefen per docker exec in einen toten Container, der Fallback griff auf die laengst verschwundenen Compose-Services odoo_web/odoo_queuejobs/odoo_cronjobs zu, und das Update meldete trotzdem "completed successfully" - eine 3dm-Staging-Instanz stand so gut fuenf Stunden auf 502, bis es jemandem auffiel. Ist der Container weg, wird jetzt der echte Service `odoo` gestartet; sein Supervisor bringt web/queuejobs/cronjobs selbst hoch. Ausserdem im Supervisor: eine Rolle, deren Schalter aus ist (RUN_ODOO_CRONJOBS=0), wird nicht mehr endlos neu gestartet - `odoo update` startet am Ende alle drei Rollen, das Kind stieg sofort wieder aus ("Cronjobs shall not run") und wurde etwa zweimal pro Sekunde neu gestartet, auf einer Staging-Instanz sieben Tage lang mit rund 50 Prozent CPU-Last; jeder dieser Starts schiesst per kill_odoo ausserdem auf die laufenden Web-Prozesse. Und: `supervisor.py` mit unbekanntem Argument (z.B. --help) fiel bisher in den Daemon-Modus und riss damit im laufenden Container die Web-Prozesse ab - unbekannte Argumente geben jetzt die Usage aus, und ein zweiter Daemon verweigert den Start, wenn der Kontroll-Socket schon antwortet.'
breaking: false
