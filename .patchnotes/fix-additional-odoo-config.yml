type: fix
description: "~/.odoo/odoo.config und odoo.config.<projekt> wirken wieder. Der Inhalt reist als eine Zeile in der Umgebungsvariablen ADDITIONAL_ODOO_CONFIG in den Container (Zeilenumbrueche gehen dort nicht), wurde dort aber nie wieder aufgetrennt, sondern so an configparser gegeben. Der liest '[options]___|||___dbfilter = .*' als Section-Header und wirft den Rest der Zeile weg - ohne Fehler und ohne Warnung. Damit war jede Option aus diesen Dateien wirkungslos, und weil die Config-Templates per ADD im Image liegen, gab es gar keinen Weg mehr, eine odoo.conf-Option ohne Rebuild zu setzen. Zum Testen: 'printf \"[options]\\ndbfilter = .*\\n\" > ~/.odoo/odoo.config.$PROJECT', dann 'odoo reload && odoo up -d' und 'docker exec ${PROJECT}_odoo grep dbfilter /etc/odoo/config/config_webserver' - die Zeile muss jetzt drinstehen. Kommt trotz gesetzter Variable keine Option an, sagt der Container das beim Start rot heraus, statt es zu verschlucken."
breaking: false
