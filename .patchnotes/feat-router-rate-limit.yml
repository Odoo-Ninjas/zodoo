type: minor
description: |
  Der vhost-Router kann jetzt je Absender-IP begrenzen: `rate_limit`
  (nginx-Syntax, z.B. "10r/s") und `rate_limit_burst`. Wer darueber liegt,
  bekommt 429.

  Zum Testen: einen vhost ohne die Felder anschauen - er muss unveraendert
  rendern, ohne jede limit_req-Zeile. Nur ein vhost, der `rate_limit` setzt,
  bekommt Zone und Begrenzung.
breaking: false
