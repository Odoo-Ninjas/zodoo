type: feature
description: "Restore the pre-supervisor split-container layout for legacy Odoo v11/v13 images: odoo, odoo_cronjobs, odoo_queuejobs and odoo_update are real compose services again (those versions run Debian Buster with Python 3.7 and predate the in-container supervisor). run.py runs the full prepare (prepare_run_shared + prepare_run_role) so each role container renders its own config_*. importlib.metadata import is made py3.7-safe in run.py / update_modules.py. lib_control_with_docker only forwards 'odoo restart odoo_cronjobs' etc. to the in-container supervisor on v14+. lib_composer's walrus-operator usage in _export_container_buildsettings is rewritten so the module parses under Python 3.7 when zodoo is bind-mounted into a legacy container."
breaking: false
