type: bugfix
breaking: false
description: |
  Der Code-/VSCode-Container einer Instanz startet wieder. Bisher ist er
  reproduzierbar mit Exit-Code 1 gestorben, im Log stand nur

      chown: invalid user: 'coder:coder'

  Ursache: das entrypoint-Skript legt einen unprivilegierten Benutzer `coder`
  mit der UID des Host-Eigentuemers an (`OWNER_UID`, in der Praxis fast immer
  1000, weil das der erste Benutzer der Maschine ist). Das Basis-Image
  `gitpod/openvscode-server` bringt aber schon `openvscode-server` mit genau
  dieser UID mit, und `useradd -u` verweigert eine doppelte UID. Der Fehler
  wurde verschluckt (`2>/dev/null || true`), also existierte `coder` nie und
  das folgende `chown coder:coder` brach ab.

  Jetzt uebernimmt das Skript den Benutzer, der die UID bereits haelt, und legt
  `coder` nur an, wenn die UID frei ist. Die Gruppe wird ueber `id -gn`
  ermittelt statt gleich dem Benutzernamen angenommen.

  Zum Testen: an einer Instanz im CICD auf "Code" klicken. Der Container
  `<projekt>_coding` muss laufen bleiben (`docker ps`) und `/code/` die
  VSCode-Oberflaeche zeigen, statt in eine Fehlerseite zu laufen.
