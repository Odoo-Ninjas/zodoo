type: fix
description: "backup: 'odoo backup all' works on hosts without the zip package. It shelled out to the external zip binary and aborted with FileNotFoundError: 'zip' wherever that is not installed (backup odoo-db and backup files were unaffected, so only the combined odoo-sh archive failed). The archive is now built with Python's zipfile: no external dependency, and no temporary zipped.zip written into the filestore folder itself. Same layout as before, dump.sql plus filestore/ at the archive root. The restore side had the same problem twice: the dump-type detector probed the archive with 'unzip -l' and swallowed the error, so without the unzip package an odoo-sh archive was silently misdetected as a plain pg_dump and handed to pg_restore — which aborts only after the target database has been dropped — and the odoo-sh restore path itself shelled out to 'unzip'. Both now use zipfile as well, so 'odoo backup all' and 'odoo restore odoo-db <file>.zip' work as a round trip on hosts without zip/unzip installed."
breaking: false
