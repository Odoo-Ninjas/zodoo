type: fix
description: "backup: 'odoo backup all' works on hosts without the zip package. It shelled out to the external zip binary and aborted with FileNotFoundError: 'zip' wherever that is not installed (backup odoo-db and backup files were unaffected, so only the combined odoo-sh archive failed). The archive is now built with Python's zipfile: no external dependency, and no temporary zipped.zip written into the filestore folder itself. Same layout as before, dump.sql plus filestore/ at the archive root, so it still restores via 'odoo restore odoo-db <file>.zip'."
breaking: false
