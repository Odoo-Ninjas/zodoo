type: fix
description: "DEVMODE kappt bei Odoo 19 jetzt auch den Outlook-Kalender-Sync. Nach `odoo restore odoo-db` mit DEVMODE=1 (oder `odoo dev-env turn-into-dev`) sind die Microsoft-Tokens aller Benutzer geleert, der Sync ist bei allen auf gestoppt gesetzt und die beiden Client-Secrets (microsoft_calendar_client_secret, microsoft_outlook_client_secret) sind gelöscht. Bisher blieben die echten Refresh-Tokens in der Dev-Kopie stehen; ein Sync von dort schrieb in die realen Outlook-Kalender, und Outlook verschickte die Einladungen. Prüfen: Dev-Kopie mit DEVMODE=1 einspielen, dann in Einstellungen → Allgemein → Integrationen ist das Outlook-Client-Secret leer, und im Kalender eines vorher verbundenen Benutzers steht der Outlook-Sync auf gestoppt. Datenbanken ohne die Microsoft-Module laufen wie bisher durch. Dokumentiert ist außerdem der MANIFEST-Key `neutralize` für projekteigene Neutralisierungsskripte."
breaking: false
