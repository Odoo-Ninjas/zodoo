type: bugfix
description: "Der rsync-Container wird nicht mehr mitgestartet. Er stand ohne eigenes Profil in der compose-Datei und landete damit im Profil 'auto', das 'odoo up -d' hochfaehrt. Da das Image als Einstiegspunkt 'rsync' ohne Argumente aufruft, gab es seine Hilfe aus und endete mit Exit 1. Seit 7.2.0 wertet der Watchdog alles ausser 0, 130 und 143 als Absturz - auf Instanzen mit DEVMODE=0 und RUN_RSYNC=1 hat er den Container also im Minutentakt neu gestartet, ohne dass das je klappen konnte. Auf Entwicklungsmaschinen faellt es nicht auf, weil DEVMODE=1 den Watchdog ueberspringt; sichtbar war nur ein dauerhaftes 'Exited (1)' in 'docker ps -a'. Der Container einfach ins vorhandene Profil 'manual' zu schieben waere die naheliegende Loesung gewesen, haette aber das Image nicht mehr gebaut, weil 'odoo build' mit Profil 'auto' laeuft - und ein fehlendes rsync-Image faellt erst auf, wenn jemand einen Snapshot zurueckspielt, weil es dort per 'docker run' gebraucht wird. Deshalb gibt es jetzt das Profil 'build_only': der Build zieht es mit, 'odoo up' nicht. Zum Testen: 'odoo build' laufen lassen und pruefen, dass es das Image '<projekt>-rsync:latest' danach gibt ('docker images | grep rsync'); dann 'odoo up -d' und pruefen, dass in 'docker ps -a' kein rsync-Container mehr auftaucht. Anschliessend einen Snapshot anlegen und zurueckspielen - das muss unveraendert funktionieren. Der pgtools-Container bleibt bewusst wie er ist: er wird tatsaechlich als compose-Service verwendet und endet sauber mit 0."
breaking: false
