type: feature
breaking: false
description: |
  `odoo pgbackrest verify` bekommt `--bench-config` — damit prueft ein
  eigener Pruefstand FREMDE Bereiche mit derselben Probe.

  Bisher konnte die Rueckspielprobe nur die Sicherungen des Projekts pruefen,
  in dem sie aufgerufen wird. Die Maschine, die stellvertretend fuer alle
  Kunden prueft, hat aber gar kein Projekt - sie haette also eine zweite
  Umsetzung derselben Sache gebraucht. Zwei Umsetzungen laufen frueher oder
  spaeter auseinander, und dann prueft der Pruefstand etwas anderes als das,
  was getestet wurde.

  Zum Ausprobieren: `odoo pgbackrest verify --bench-config <datei.json>`. Die
  Datei sagt, WOHER Repository, Zertifikat und Bereiche kommen; getan wird
  danach genau dasselbe wie im Projekt. Ohne Bereichsangabe werden alle
  Bereiche der Datei nacheinander geprueft, mit `--stanza` nur einer.

      {
        "repo_host": "db.backup.zebroo.de", "repo_port": 443,
        "cert_dir": "/etc/pgbr-pruefstand/cert",
        "pgbackrest_image": "pgbr-pruefstand:2.59.1",
        "run_user": "999:999",
        "stanzas": {"kunde-a": {"cipher_pass": "..."}}
      }

  Worauf zu achten ist: die Passphrase steht je Bereich, nicht global — jeder
  Kunde hat eine eigene. Die abgelegte Konfiguration bleibt 0600 und gehoert
  dem Benutzer, unter dem der Container laeuft; sie enthaelt Geheimnisse.

  Fuer bestehende Aufrufe aendert sich nichts. Ohne `--bench-config` laeuft
  alles wie zuvor.
