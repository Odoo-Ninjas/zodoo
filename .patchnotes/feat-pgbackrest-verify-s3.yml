type: feature
breaking: false
description: |
  Der Pruefstand kann jetzt auch Bestaende in einem OBJEKTSPEICHER pruefen
  (S3 / MinIO), nicht nur ueber einen pgBackRest-Repo-Host.

  Hintergrund: der unveraenderliche Zweitbestand liegt auf einem MinIO mit
  Object Lock. Ohne diese Erweiterung haetten wir eine Kopie, von der niemand
  laufend nachweist, dass sich daraus zurueckspielen laesst - genau der
  Zustand, den wir beim ersten Bestand gerade behoben haben.

  Zum Ausprobieren: in der Pruefstand-Konfiguration `"repo_type": "s3"` setzen
  und `s3_endpoint`, `s3_bucket`, `s3_key`, `s3_key_secret` angeben, dazu
  optional `s3_path` (Praefix im Bucket) und `storage_ca_file`. Ein
  Client-Zertifikat entfaellt - ein Objektspeicher weist ueber ein
  Schluesselpaar aus.

  Worauf zu achten ist: `s3_uri_style` steht auf `path`, weil MinIO Buckets
  ueber den Pfad adressiert. Bei einem Anbieter mit eigenem DNS je Bucket
  waere `host` richtig. Und die Verschluesselung bleibt bei uns: der Speicher
  sieht Chiffrat, egal ob eigener MinIO oder fremder Anbieter.
