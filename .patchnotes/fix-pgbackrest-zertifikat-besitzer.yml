type: fix
description: 'pgBackRest mit Repo-Host lief nach der Anmeldung nicht: die TLS-Schluessel gehoerten dem Betriebsbenutzer, pgBackRest verlangt aber einen Schluessel, der ihm selbst oder root gehoert (Fehler 42, ''key file ... must be owned by the pgbackrest user or root''), und das WAL-Archiv lief in den Zeitueberlauf (Fehler 82/103). Die Anmeldung meldete dabei Erfolg -- die Sicherung waere nachts still ausgefallen, und das faellt sonst erst am Tag der Wiederherstellung auf. Ursache: geschrieben werden die Dateien vom Betriebsbenutzer, der den Besitz gar nicht auf den pgbackrest-Benutzer vergeben DARF; das kann nur root. Kopieren ist kein Ausweg, weil der Schluessel 0600 ist und ein fremder Prozess ihn nicht einmal lesen kann. Der entrypoint laeuft als root und schreibt den Besitz jetzt um; dafuer ist der Mount von /etc/pgbackrest nicht mehr read-only. Damit eine erneute Anmeldung die Dateien noch ersetzen kann, loescht register sie vorher statt sie zu ueberschreiben. Zum Testen: nach der Anmeldung ein ''odoo reload && odoo up -d && odoo pgbackrest check'' -- muss ''completed successfully'' melden; danach zeigt ''odoo pgbackrest info'' cipher aes-256-cbc und eine Sicherung unter repo1.'
breaking: false
