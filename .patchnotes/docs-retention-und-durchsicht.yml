type: docs
breaking: false
description: |
  Die pgBackRest- und Offsite-Doku sagt jetzt, was der Code tut. An drei
  Stellen sagte sie das Gegenteil.

  Aufbewahrung: Doku und der in jede Instanz-Konfiguration gerenderte
  Kommentar behaupteten "Retention lives on the backup server" und
  "PGBR_RETENTION_* are therefore ignored in this mode" - und direkt darunter
  standen die Retention-Zeilen. Richtig ist: `expire` muss `backup.info`
  LESEN, und die ist clientseitig verschluesselt. Bei `BACKUP_FROM=here`
  (gepusht) hat nur die Instanz die Passphrase, also gehoert die Aufbewahrung
  dorthin; nur bei `BACKUP_FROM=repo-host` (gezogen) haelt der Backup-Server
  sie und kann selbst aufraeumen. Bis 31.08.2026 stand sie nirgends, und
  expire lief entsprechend nirgends.

  Dazu ausgeraeumt: die Lesart, die Instanz koenne ihre Historie nicht
  loeschen. Sie kann - mit ihrem eigenen Zertifikat und ihrer Passphrase,
  ausprobiert. Was schuetzt, ist der unveraenderliche Zweitbestand, nicht eine
  fehlende Konfigurationszeile.

  Offsite: der GEMISCHTE Fall fehlte ganz - Datenbank ueber pgBackRest, nur
  der Filestore write-only. Das ist unser Normalaufbau und war zugleich der,
  der nichts sicherte. Jetzt steht da, welcher Strom wann laeuft und welche
  zwei Faelle seit 05.09.2026 absichtlich laut sind.

  Beim Durchsehen aufgefallen und ergaenzt:

  - `PGBR_ARCHIVE_PUSH_QUEUE_MAX` stand in keiner Doku. Das ist die
    Einstellung, bei deren Ueberschreiten pgbackrest die GANZE WAL-Warteschlange
    wegwirft und postgres Erfolg meldet - der einzige Ausfall im System, der
    die Punkt-genau-Wiederherstellung still zerstoert. Mit dem Hinweis, dass
    man ihn pro Maschine an den echten freien Platz von pg_wal setzt.
  - Sechs Befehle fehlten in der Liste, darunter `verify` und `repo-verify` -
    also ausgerechnet die beiden, die pruefen, ob die Sicherung etwas taugt.
    Mit den zwei Fallen von `repo-verify`: es endet auch bei Maengeln mit 0,
    und ein heiler Bestand erzeugt gar keine Statuszeile.

  Worauf beim Testen zu achten ist: `odoo reload` auf einer Instanz mit
  Repo-Host erzeugen und in der gerenderten `pgbackrest.conf` nachsehen - der
  Kommentarblock ueber den `repo1-retention-*`-Zeilen muss jetzt zu ihnen
  passen.
