type: fix
description: "Das in zodoo mitgelieferte gimera ist von 0.12.0 auf 0.13.0 angehoben. Zwei Dinge kommen damit an: Erstens legt gimera den Golden Cache unter ~/.cache/gimera nicht mehr doppelt an. Bisher lag jedes Repository dort zweimal - einmal als das bare Repository, das tatsaechlich benutzt wird, und noch einmal als Tarball genau desselben Standes, der bei jedem Update neu geschrieben und nur gelesen wurde, um das Repository daneben wiederherzustellen. Bei odoo/odoo waren das zweistellige GB ohne Gegenwert. Ein Tarball, den eine aeltere Version hinterlassen hat, wird beim naechsten gimera-Lauf entfernt, und es wird gemeldet, wieviel Platz dadurch frei geworden ist - sonst laege er fuer immer da, ohne dass man die Herkunft zuordnen koennte. Zweitens werden liegengebliebene Sperrdateien wieder erkannt: wurde ein gimera-Lauf hart abgeschossen, blockierte der naechste Lauf auf demselben Repository bislang eine volle Stunde und brach dann mit 'Timeout occured.' ab, weil die Aufraeumlogik nach einem Dateinamen suchte, den nie jemand anlegt. Zum Testen: 'du -sh ~/.cache/gimera' vor und nach dem naechsten 'odoo update' bzw. 'gimera apply' vergleichen - der Ordner sollte deutlich kleiner werden, und in der Ausgabe steht ein Hinweis auf den entfernten Alt-Tarball. Ansonsten aendert sich am Verhalten nichts; die Option --clear-zip-cache gibt es weiterhin, sie tut aber nichts mehr und weist darauf hin."
breaking: false
