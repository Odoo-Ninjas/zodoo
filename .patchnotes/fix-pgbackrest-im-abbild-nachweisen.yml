type: fix
breaking: false
description: |
  Das postgres-Abbild wird jetzt beim BAUEN darauf geprueft, dass pgbackrest
  wirklich drin ist.

  Hintergrund: der Installations- und Aufraeumblock in
  `postgres/Dockerfile.*` endet mit `find ... 2>/dev/null;` - einem
  SEMIKOLON. Der Rueckgabewert des ganzen RUN ist damit der des
  abschliessenden `rm -rf`, und der gelingt praktisch immer. Scheitert weiter
  oben etwas - etwa `apt-get install pgbackrest=<version>-*`, weil der
  Debian-Spiegel diese Version nicht mehr fuehrt - dann baut das Abbild
  trotzdem durch, nur ohne pgbackrest.

  Was man dann sieht, ist nicht der Bau, sondern der Betrieb: das
  archive_command stirbt mit `pgbackrest: command not found` (exit 127), und
  in den Protokollen steht "WAL segment was not archived before the 60000ms
  timeout". Das sieht nach einem Zeitproblem aus und ist keins - wer darauf
  den `archive-timeout` hochsetzt, meldet denselben Ausfall nur spaeter.

  Am 04.09.2026 hat genau das die pgBackRest-e2e-Tests gekippt, auf `main`
  und auf einem Zweig, im selben Commit einmal rot und einmal gruen - und
  vorher eine echte Instanz getroffen, deren Archivierung nach dem Bauen nie
  lief.

  Worauf beim Testen zu achten ist: der Bau bricht jetzt mit
  `command -v pgbackrest` ab, wenn die Binaerdatei fehlt. In der Bauausgabe
  steht danach die pgbackrest-Version - taucht sie nicht auf, ist das Abbild
  nicht brauchbar. Betrifft alle sechs Postgres-Fassungen (11 bis 17).
