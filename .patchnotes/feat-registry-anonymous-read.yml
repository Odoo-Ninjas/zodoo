type: feature
description: "Die zodoo-Registry wird jetzt standardmaessig zum Lesen genutzt, ohne dass man vorher etwas einrichten muss. Bisher fragte der erste 'odoo build' auf einer frischen Maschine 'Do you want to use the zodoo registry?' und wollte gleich danach einen Account anlegen - also eine Identitaet, bevor ueberhaupt feststand, ob eine gebraucht wird. Wer die Frage wegklickte oder in einer Umgebung ohne Terminal baute, bekam kein vorgebautes CPython aus der Registry und compilierte es selbst, was rund 12 Minuten dauert. Neu ist die Trennung von Lesen und Schreiben: Pullen laeuft ohne Konto (registry.zebroo.de liefert das Image zodoo/python anonym aus, alles andere bleibt hinter der Anmeldung, insbesondere die Repository-Liste), und nach einem Account gefragt wird erst, wenn tatsaechlich ein gebautes Image hochgeladen werden soll. Wer die Registry gar nicht will, setzt weiterhin ZODOO_REGISTRY_SUGGESTED=0. Ausserdem ist der Vorschlag fuer den Benutzernamen brauchbarer geworden: hiess der Systembenutzer 'odoo' oder 'root', wurde genau das vorgeschlagen - ein Name, den es auf der Registry laengst gibt, sodass die Anlage mit 'existiert bereits' zurueckkam. Jetzt wird in so einem Fall der Name der Maschine herangezogen, aus odoo.3dm.de wird also '3dm'. Weil fuer den anonymen Pull auch der Versions-Endpunkt der Registry offen sein muss, meldet 'docker login' dort jetzt selbst bei falschem Passwort Erfolg - es prueft nur, ob ueberhaupt eine Anmeldung verlangt wird. Damit ein Vertipper nicht erst beim Push auffliegt, prueft zodoo die Zugangsdaten selbst gegen einen weiterhin geschuetzten Endpunkt und sagt sofort Bescheid, wenn sie abgelehnt werden; ist die Registry nicht erreichbar, wird das als solches gemeldet und nicht als falsches Passwort. Zum Testen: auf einem Rechner ohne Registry-Zugangsdaten (ZODOO_REGISTRY_USERNAME/PASSWORD leer) 'odoo build' starten - es darf keine Frage nach der Registry mehr kommen, und im Log muss zodoo/python aus der Registry gezogen statt gebaut werden. Erst wenn hinterher gepusht wird, taucht die Frage nach dem Konto auf. Fuer den zweiten Teil bewusst ein falsches Passwort in ~/.odoo/settings eintragen - es muss eine rote Meldung kommen, bevor irgendetwas hochgeladen wird."
