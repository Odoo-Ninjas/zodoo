type: feature
description: |
  `odoo pgbackrest register --approve` gibt die eigene Anmeldung gleich auf der
  Konsole frei, statt zu warten, bis jemand die Freigabemaske im VPN oeffnet.
  Der Befehl fragt verdeckt nach dem Anmeldegeheimnis (haben nur wir), gibt die
  Anfrage beim Anmeldedienst frei und holt im selben Aufruf Zertifikat und
  Passphrase ab.

  Zum Ausprobieren: `odoo pgbackrest register --approve`, Geheimnis eingeben,
  danach wie gehabt `odoo reload && odoo up -d && odoo pgbackrest check`.
  Ohne die Option aendert sich nichts.

  Freigeben kann nur, wer das Geheimnis hat UND das Abhol-Token dieser Anfrage,
  das beim Anfragen auf dieser Maschine landet - fremde Anmeldungen lassen sich
  damit nicht durchwinken. Fehlt das Token, wird gar nicht erst gefragt.

  Die Zugangsdaten gibt es weiterhin erst, wenn der Umschlag mit der Passphrase
  am Projekt in hosting.zebroo.de liegt. Laesst sich das Projekt nicht
  bestimmen, bleibt die Anmeldung stehen und der Befehl sagt gelb, was auf dem
  Backup-Server noch fehlt.

  Serverseite: Odoo-Ninjas/zebroo-backup-server#10.
breaking: false
