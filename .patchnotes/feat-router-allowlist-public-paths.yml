type: feature
description: >
  Router: einzelne Pfade koennen trotz IP-Allowlist offen bleiben. Am Virtual
  Host lassen sich unter "Oeffentliche Pfade" Prefixe eintragen (z.B.
  /hosting/, /newhost), die auch von ausserhalb der erlaubten Netze erreichbar
  sind und normal an den Upstream weitergehen. Gedacht fuer APIs, die von
  Kundenmaschinen aus dem Internet erreichbar sein muessen und sich selbst
  authentifizieren -- dort waere die Allowlist eine Sperre, kein Schutz.
  Zu pruefen nach dem Ausrollen: der vhost mit Allowlist antwortet auf einem
  offenen Pfad nicht mehr mit 403, auf allen anderen weiterhin.
breaking: false
