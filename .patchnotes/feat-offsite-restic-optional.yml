type: feature
description: "Gehen beide Stroeme write-only, wird restic gar nicht mehr benutzt - dann verlangt ein Offsite-Lauf auch keine Repo-Adresse und keine Passphrase mehr. Damit verschwindet auf solchen Maschinen das teuerste Geheimnis des Aufbaus: die Passphrase, mit der sich die gesamte Historie entschluesseln laesst. Auf dem Backup-Server legt 'restic-area retire <bereich>' die alten Repos still (verschieben, nicht loeschen) - sonst wuerde der 48-Stunden-Alarm je Strom ab dem naechsten Tag dauerhaft feuern, weil niemand mehr hineinschreibt."
breaking: false
