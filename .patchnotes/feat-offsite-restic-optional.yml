type: feature
description: "Gehen beide Stroeme write-only, wird restic gar nicht mehr benutzt - dann verlangt ein Offsite-Lauf auch keine Repo-Adresse und keine Passphrase mehr, und der Anmeldedienst erzeugt gar keinen Repo-Key mehr. Eine so eingerichtete Maschine haelt damit KEIN Geheimnis, mit dem sie ihre eigene Sicherung lesen koennte: sie bekommt einen Upload-Zugang und zwei OEFFENTLICHE age-Schluessel. Das Zugangspasswort ist ersetzbar (restic-area passwd); unersetzlich sind nur die privaten age-Schluessel, und die entstehen nicht auf dem Server, sondern liegen im Vault. Ein aelterer Backup-Server, der noch Repo-Keys ausgibt, funktioniert unveraendert weiter. Auf dem Server legt 'restic-area retire <bereich>' die alten Repos still (verschieben, nicht loeschen) - sonst feuert der 48-Stunden-Alarm je Strom ab dem naechsten Tag dauerhaft."
breaking: fals Ausserdem drei Skalierungsfunde behoben, nachdem gemessen wurde: die minuetlichen WAL-Laeufe aller Instanzen liefen in derselben Sekunde (jetzt fester Versatz aus dem Projektnamen), und ein Manifest je Lauf ergab bei einer geschaeftigen Datenbank hunderte Dateien am Tag je Bereich - jetzt ein Manifest je Tag mit einer JSON-Zeile je Lauf, angehaengt statt ersetzt, was zum write-only Modell passt."
