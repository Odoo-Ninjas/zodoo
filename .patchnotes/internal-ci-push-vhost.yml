type: internal
description: 'Der prebuild-Ablauf schiebt die Images jetzt ueber registry-push.zebroo.de statt ueber registry.zebroo.de. Der Pull-Weg bedient /v2/ und die zodoo-Abbilder bewusst anonym, damit eine frische Maschine ohne Zugangsdaten ziehen kann -- der klassische docker-Client schliesst daraus zu Beginn einer Push-Sitzung, dass keine Anmeldung noetig ist, und schickt danach gar keine Zugangsdaten mehr; das abschliessende Ablegen des Manifests scheitert mit 401. Nur Clients mit containerd-Bildspeicher sind davon nicht betroffen, was lange verschleiert hat, worum es geht. Der neue Name zeigt auf denselben Registry-Server, verlangt aber ueberall Anmeldung; gezogen wird weiter ueber den alten Namen, es ist derselbe Bestand. Ausserdem wird die Postgres-Fassung jetzt ausdruecklich gesetzt statt der Voreinstellung ueberlassen: die haengt an ~/.odoo/settings der bauenden Maschine, und auf einem anderen Rechner entstanden so Images fuer Postgres 14, die zu keiner Kundenmaschine passen. Steuerbar ueber die Repository-Variablen ZODOO_REGISTRY_PUSH_URL und ZODOO_PREBUILD_POSTGRES.'
breaking: false
