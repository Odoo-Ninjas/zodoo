type: fix
description: "Supervisor roles no longer shoot each other down after a container restart. `kill_odoo()` only signals a pid from `/tmp/odoo.<role>.pid` if it is still the odoo-bin started with exactly that `--pidfile`; a pidfile left over from the previous run (/tmp survives `odoo restart`) used to hit a sibling role's process, which orphaned e.g. the queuejobs server and left the role respawning with \"Address already in use\". The wrapper also keeps the pidfile while its odoo-bin is still alive, so a later respawn can stop it. Roles spawned by the supervisor no longer re-render the shared config files (that is done once by the supervisor), which removes the sporadic `KeyError: 'options'` crash at startup."
breaking: false
