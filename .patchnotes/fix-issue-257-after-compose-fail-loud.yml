type: fix
description: "`odoo reload` bricht jetzt ab, wenn der odoo-Hook (images/odoo/__after_compose.py) scheitert, und zeigt den Traceback. Bisher kamen nur zwei gelbe Zeilen, reload endete mit Exit-Code 0, und `odoo build` baute danach ein Image ohne die pip-Pakete des Projekts und ohne die odoo-Konfiguration. Unter Odoo 20 fehlte so z. B. tzdata, und neue Datenbanken luden ihre Demodaten nicht. Hooks der anderen Dienste (proxy, cronjobs …) warnen weiterhin nur, jetzt aber mit Traceback. Außerdem stört ein Modul auf der MANIFEST-Liste `uninstall` nicht mehr, wenn eine seiner Abhängigkeiten schon fehlt: die fehlende Abhängigkeit wird mit einem Hinweis übersprungen. Fehlt dagegen eine Abhängigkeit eines Moduls aus `install`, bleibt das ein Fehler. Prüfen: Modul mit nicht mehr vorhandener Abhängigkeit unter `uninstall` eintragen → `odoo reload` läuft durch und meldet „Ignoring missing dependency …“. Dieselbe Abhängigkeit bei einem `install`-Modul → `odoo reload` endet mit Exit-Code 1 und Traceback."
breaking: false
