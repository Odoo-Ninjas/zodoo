type: docs
breaking: false
description: |
  Dokumentiert, warum die Odoo-Basisabbilder auf alten Distributionen stehen -
  und warum bullseye JETZT nicht umgestellt werden darf.

  Jede Odoo-Generation hat eine Basis ihrer Epoche: 11 auf buster, 12 bis 14
  auf bullseye, 15 bis 19 auf Ubuntu 22.04. Das ist Absicht, altes Odoo
  braucht altes Python. 12 bis 14 auf bookworm zu heben ist keine Haertung,
  sondern ein Bruch: bookworm liefert Python 3.11, und Odoo 12 von 2018 laeuft
  darauf nicht.

  Kaputt geht nicht der laufende Container, sondern der BAU - sobald Debian
  eine Fassung von deb.debian.org ins Archiv verschiebt. Bei buster ist das
  schon passiert; odoo/config/11 ueberlebt es, weil es seine Quellen vorher
  umschreibt. Das Rezept steht jetzt in der Doku, samt dem Teil, den man
  vergisst: `Acquire::Check-Valid-Until "false"`, weil die Release-Dateien im
  Archiv per Definition abgelaufen sind.

  Fuer bullseye gilt am 07.09.2026 gemessen:

  - deb.debian.org bedient bullseye UND bullseye-security vollstaendig
  - archive.debian.org hat bullseye und bullseye-updates
  - archive.debian.org hat bullseye-security NICHT (404)

  Wer jetzt umstellt, macht den Bau kaputt statt ihn zu retten: `apt-get
  update` endet mit 100, weil der Security-Zweig wegfaellt. Nachgestellt, nicht
  vermutet. Umstellen also erst, wenn deb.debian.org bullseye nicht mehr
  fuehrt - und den Security-Zweig dann getrennt pruefen.

  Ausserdem eine wirkungslose Zeile in odoo/config/11 entfernt: sie legte eine
  apt-Quelle als sources.list.d/dmtx ab, OHNE .list-Endung, und apt liest dort
  nur *.list. Die Zeile hat nie gewirkt. Nachgemessen: ohne Endung erwaehnt apt
  die URL null mal und endet mit 0, mit Endung dreimal und endet mit 100.
  libdmtx0b kommt aus buster main und laesst sich ohne die Quelle installieren
  (geprueft).

  Worauf beim Testen zu achten ist: `odoo build` fuer ein Odoo-11-Projekt muss
  unveraendert durchlaufen.
