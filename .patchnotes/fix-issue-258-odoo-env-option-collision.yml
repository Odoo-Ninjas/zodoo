type: fix
description: "Odoo 19 und 20: `RUN_ODOO_CRONJOBS=0` schaltet die Cronjobs wieder wirklich ab. Ab Odoo 19 liest Odoo jede Config-Option zusätzlich aus einer Umgebungsvariable `ODOO_<OPTION>`, und die Umgebung schlägt die Config-Datei. Der Container-Default `ODOO_MAX_CRON_THREADS=2` ließ deshalb Webserver, Queue-Job-Runner und Debug-Instanz je zwei Cron-Threads starten, obwohl in ihren Config-Dateien `max_cron_threads = 0` steht. zodoo gibt eine solche Variable jetzt nicht mehr an odoo-bin weiter, wenn die Option in der Config-Datei der Rolle steht – die Datei gilt wieder wie vor Odoo 19. Betrifft auch `ODOO_LOG_LEVEL`, `ODOO_DATA_DIR` und `ODOO_DBFILTER`, sofern die Datei sie setzt. Prüfen: Projekt mit Odoo 19/20, `odoo setting RUN_ODOO_CRONJOBS=0`, `odoo reload`, `odoo up -d`; im Log steht beim Start „Not passing to odoo-bin (set in config_webserver): … effective max_cron_threads=0“, und `select max(lastcall) from ir_cron` bleibt über mehrere Minuten unverändert. Odoo bis 18 ist nicht betroffen."
breaking: false
