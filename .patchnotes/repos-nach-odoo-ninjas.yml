type: internal
description: |
  gimera, odoo-anonymize und odoo-cleardb sind vom Privataccount marcwimmer
  nach Odoo-Ninjas umgezogen. Die Verweise in zodoo zeigen jetzt direkt dorthin.

  Betroffen sind der gimera-Pin in `zodoo/src/gimera.yml`, die beiden URLs in
  `lib_db.py` und die `gimera.yml` der Projektvorlagen fuer alle acht
  Odoo-Versionen (11.0 bis 19.0). Letztere sind der eigentliche Grund fuer die
  Aenderung: die Vorlage wird beim Anlegen eines Projekts kopiert und trug die
  Adresse des Privataccounts damit dauerhaft in jedes Kundenrepository.

  Bestehende Projekte muessen nichts tun. GitHub leitet die alten Adressen
  weiter, vorhandene Pins und Klone funktionieren unveraendert weiter; sie
  ziehen die neue Adresse erst beim naechsten Anfassen der jeweiligen
  gimera.yml.
breaking: false
