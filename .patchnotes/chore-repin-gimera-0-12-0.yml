type: feature
description: "Das mitgelieferte gimera ist von 0.7.118 auf 0.12.0 angehoben worden - der bisherige Stand lag 65 Commits und vier Minor-Versionen zurueck, sodass dort laengst geloeste Probleme bei uns weiterbestanden. Das wichtigste davon betrifft den Plattenplatz: gimera legt fuer grosse Repositories einen gemeinsamen Zwischenspeicher an, und der wurde bisher als vollstaendige Kopie samt aller alten Dateistaende gezogen. Bei odoo/odoo waren das rund 17 GB, auf einem Server mit 75 GB Platte also ein erheblicher Anteil. Ab 0.12.0 werden nur noch die Historie und die tatsaechlich benoetigten Dateistaende geholt, gemessen 1,4 GB statt 17 GB. Bereits vorhandene Zwischenspeicher bleiben unangetastet - wer den Platz zurueckhaben will, loescht den Ordner unter ~/.cache/gimera einmal von Hand, danach wird er in der schlanken Form neu aufgebaut. Ebenfalls neu ist, dass sich einzelne Repositories per Konfiguration vom Zwischenspeichern ausnehmen lassen. Zum Testen: 'odoo reload' und 'odoo build' auf einem bestehenden Projekt durchlaufen lassen - beides muss sich unveraendert verhalten. Wer den Effekt sehen will, loescht vorher ~/.cache/gimera und vergleicht die Groesse danach. Nebenwirkung des neuen gimera: es traegt beim ersten Lauf '.gimera' in die .gitignore neben der gimera.yml ein, das ist die Konfigurationsdatei fuer die Cache-Ausnahmen."
breaking: false
