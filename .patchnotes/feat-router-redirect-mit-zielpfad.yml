type: feature
breaking: false
description: |
  Router: Redirect-vHosts koennen jetzt auf eine bestimmte Seite zeigen, nicht
  nur auf eine andere Domain.

  Bisher hat das `redirect`-Template den Pfad des Aufrufs immer an das Ziel
  angehaengt (`$request_uri`). Fuer "Domain A zeigt auf Domain B" ist das
  richtig, fuer "Domain A zeigt auf genau diese Seite" nicht: aus
  `redirect_to: zebroo.de/zebroo-experience` wurde beim Aufruf von `/` die
  Adresse `zebroo.de/zebroo-experience/` und beim Aufruf von `/irgendwas`
  entsprechend `zebroo.de/zebroo-experience/irgendwas` - beides Adressen, die
  es beim Ziel so nicht gibt.

  Steht im `Redirect To` ein Pfad (also ein `/` im Wert), wird `$request_uri`
  jetzt weggelassen und alles landet genau auf der angegebenen Seite. Ohne
  Pfad bleibt es beim alten Verhalten.

  Zum Nachschauen: hosting.zebroo.de -> Web Router -> Virtual Hosts, ein vHost
  mit Template "Redirect". Bei `Redirect To` einen Pfad mitgeben, z.B.
  `zebroo.de/zebroo-experience`, deployen, dann die Domain aufrufen - der
  Browser muss direkt auf der Zielseite stehen (eine Weiterleitung, kein
  angehaengter Pfad, kein 404). Bestehende Redirects ohne Pfad im Ziel
  erzeugen unveraenderte nginx-Dateien.
