type: bugfix
breaking: false
description: |
  Ein Render der vhost-Dateien nimmt einer Domain nicht mehr das HTTPS weg.

  Bei `use_certbot`-vhosts stehen `listen 443 ssl` und die Zertifikatspfade
  nicht in unseren Templates - die schreibt certbot in die ausgelieferte Datei
  (`# managed by Certbot`), und diese Datei ist die einzige Stelle, an der sie
  existieren. Solange der Render bitgleich zum letzten Stand ist, laesst
  sync_configs.py die Datei in Ruhe. Aendert sich am Template etwas, wird sie
  ueberschrieben - und der vhost hoert nur noch auf Port 80. Ohne Fehler, denn
  eine Konfiguration ohne TLS ist gueltig, und `nginx -t` laeuft sauber durch.
  Mit HSTS ist die Domain damit fuer Browser komplett unerreichbar.

  `odoo router vhost add` und `apply-vhosts` rendern immer die ganze Flotte,
  nicht nur den angefassten vhost. Am 09.09.2026 hat das nach einer
  Template-Korrektur 149 Domains gleichzeitig getroffen.

  Neu: nach jedem Render, der Dateien wirklich ueberschrieben hat, wird die
  Zertifikatseinbindung fuer genau die vhosts nachgezogen, die sie vorher
  hatten und jetzt nicht mehr (`certbot install`, kein ACME, keine
  Neuausstellung). Im Normalfall ist das keiner. Bleibt ein Host dabei ohne
  TLS, steht er als Klartext-Warnung im Protokoll statt unbemerkt offline.

  Ausserdem bricht `odoo router ssl` nicht mehr beim ersten fehlschlagenden
  Host ab. Bisher blieben alle dahinter liegenden vhosts unbearbeitet - wer
  das Kommando zum Wiederherstellen einer Flotte benutzte, stand mit einer
  halb versorgten Flotte da, ohne dass das Kommando das gemeldet haette. Jetzt
  laeuft er durch und zaehlt am Ende Erfolge und Fehlschlaege auf.

  Zum Testen: an einem Router mit certbot-vhosts eine Kleinigkeit am
  vhost-Template aendern und `odoo router apply-vhosts --global` laufen
  lassen. Danach muss `https://<domain>/` weiter antworten, und in
  `sites-enabled/<domain>` muessen die `# managed by Certbot`-Zeilen wieder
  stehen.
