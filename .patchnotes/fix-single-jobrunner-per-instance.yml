type: fix
description: "queue_job: only the dedicated queuejobs container runs the job runner. The web and cronjob containers had no [queue_job] channels entry, so the runner fell back to its root:1 default and started there too — up to three runners competed for the same queue_job rows, which showed up as 'SerializationFailure: could not serialize access due to concurrent update' on otherwise healthy jobs and left jobs stranded in state 'enqueued' (a stranded job blocks a capacity-1 channel and stalls the whole queue). After updating and restarting, check the web and cronjob container logs: 'queue job runner ready for db' must appear only in the queuejobs container, and the 'unknown channel <name>, using root channel' warnings are gone. Requires the queuejobs role to be active, which the supervisor spawns whenever queue_job is installed in the project DB."
breaking: false
