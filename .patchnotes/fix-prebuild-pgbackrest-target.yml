type: fix
description: |
  Das Vorbauen der Images lief seit dem 24.08.2026 in jedem Lauf auf einen
  Fehler: "could not find any target matching 'pgbackrest'". Das Wegwerf-
  Projekt, in dem gebaut wird, hatte RUN_PGBACKREST nicht gesetzt -- damit
  schreibt "odoo reload" den Dienst gar nicht erst in die Compose-Datei, und
  der Bau bricht ab, bevor irgendetwas hochgeladen wird.

  Die Folge war auf jeder Kundenmaschine zu sehen: postgres, cronjobs,
  cronjobshell, offsite und odoo_metrics_exporter meldete zodoo als "not in
  zodoo registry" und baute sie einzeln nach. Gemessen an einer frisch
  aufgesetzten Instanz sind das rund neun Minuten pro Aufsetzen statt
  anderthalb.

  RUN_PGBACKREST, RUN_OFFSITE und RUN_DASHBOARD sind jetzt im
  Wegwerf-Projekt gesetzt. Das hat dort keine Nebenwirkung -- gestartet wird
  nichts, gebraucht wird nur die richtige Berechnung der Tags.

  Ausserdem stehen cronjobshell, offsite und odoo_metrics_exporter jetzt mit
  in der Bauliste. Sie laufen auf jeder Kundenmaschine, fehlten aber.
breaking: false
