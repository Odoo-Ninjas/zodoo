type: fix
description: "Der aus dem Verzeichnisnamen abgeleitete Projektname behaelt seine Unterstriche. _sanitize_project_name() hat sie bisher immer entfernt, auch wenn der Name die Laengengrenze gar nicht gerissen hat - aus dem Verzeichnis cicd_3dm_odoo_staging17 wurde so das Projekt cicd3dmodoostaging17. Dafuer gibt es kein ~/.odoo/run/<projekt>/settings, also lief jeder Aufruf ohne -p gegen ein unkonfiguriertes Projekt: Config.__getattribute__ findet keine settings-Datei und liefert None fuer jedes Setting. 'odoo filestore unshare' brach mit 'No filestore at None' ab, 'odoo psql' tat kommentarlos nichts - mit -p <verzeichnisname> lief dasselbe Kommando durch. Die Sanity-Pruefung in cli.py, die sonst bei abweichendem Verzeichnisnamen abbricht, hat den Fall ausdruecklich durchgewunken (name was auto-shortened from this directory), deshalb blieb es unbemerkt. Unterstriche sind in Docker-Compose-Projektnamen erlaubt; sie werden jetzt nur noch entfernt, wenn der Name sonst laenger als 50 Zeichen bliebe, und erst danach wird wie bisher aus der Mitte gekuerzt. Migration: wer ein solches Projekt bisher ohne -p benutzt hat, findet seinen Compose-Stand unter dem alten zusammengezogenen Namen in ~/.odoo/run/ und zieht ihn mit einem 'odoo reload' im Projektverzeichnis nach. Zum Testen: in einem Projektverzeichnis mit Unterstrichen im Namen 'odoo psql' bzw. 'odoo filestore unshare' ohne -p aufrufen - beides muss jetzt dasselbe tun wie mit -p <verzeichnisname>."
breaking: false
