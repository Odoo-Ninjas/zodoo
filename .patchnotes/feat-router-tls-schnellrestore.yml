type: fix
breaking: false
description: |
  Verliert ein Render die TLS-Einbindung eines vHosts, wird sie jetzt in
  Millisekunden zurueckgetragen statt in Stunden - und sieben bisher
  ungeschuetzte vHosts sind mit dabei.

  Seit der letzten Fassung holt zodoo eine verlorene Einbindung ueber
  "certbot install" zurueck. Das ist richtig, aber langsam: certbot laesst nur
  einen Lauf gleichzeitig zu, die Hosts werden also hintereinander
  abgearbeitet. Bei einer Aenderung an einem Template betrifft das die ganze
  Flotte - am 09.09.2026 gemessen: fuer die Domains zwischen "d" und "e"
  vergingen rund zehn Minuten, bei 149 Domains waeren das Stunden. Und solange
  der Lauf nicht durch ist, sind die noch nicht abgearbeiteten Domains ohne
  Verschluesselung erreichbar.

  Die verlorenen Zeilen stehen aber bereits in der Sicherungskopie, die vor dem
  Ausrollen angelegt wird, und sie waren bis Sekunden vorher in Betrieb. Sie
  zurueckzuschreiben ist eine reine Textaenderung: kein certbot, keine
  Nachfrage bei Let's Encrypt, kein Netz, keine Warteschlange. Uebernommen
  werden nur die fuenf Zeilen, die certbot selbst schreibt; einen von certbot
  angelegten Weiterleitungsblock laesst zodoo bewusst liegen, weil der nicht in
  einen anderen Server-Abschnitt hineingehoert. Die Pruefung mit "nginx -t"
  laeuft ohnehin unmittelbar danach, ein unbrauchbares Ergebnis wuerde also
  auffallen und zurueckgerollt. Sollte in der Sicherung keine verwertbare Zeile
  stehen, uebernimmt weiterhin certbot.

  Ausserdem greift der Schutz jetzt fuer alle vHosts, die eine Einbindung
  hatten - nicht nur fuer die mit gesetztem use_certbot. Auf hy-router tragen
  154 vHosts eine Einbindung, aber nur 147 auch das Flag; die uebrigen sieben
  (darunter kraeuterblume.de mit seinen Umlaut-Schreibweisen) waeren beim
  naechsten Render ohne Verschluesselung zurueckgeblieben. vHosts mit
  ssl_self_signed bleiben ausdruecklich aussen vor: dort schreibt die Vorlage
  die TLS-Zeilen selbst, ein zusaetzlicher certbot-Block ergaebe ein zweites
  "listen 443" und nginx wuerde die Datei ablehnen.

  Zum Nachschauen: eine Vorlage unter router_global/templates aendern (etwa
  einen Kommentar) und "odoo router apply-vhosts --global" aufrufen. Der Lauf
  muss durchgehen, ohne dass certbot startet, und die Domains danach weiter
  ueber https antworten - "grep -c 'listen 443' sites-enabled/*" muss dieselbe
  Zahl wie vorher ergeben.
