type: docs
description: "New docs/17-filestore.md: the shared attachment filestore explained - why content is shared via hardlinks and never the directory via a symlink, how a shared `checklist` lets one database's garbage collection delete every other instance's attachments, the `odoo filestore dedup` / `unshare` commands (previously undocumented in the command reference), the recommended lifecycle on CI hosts, and how to repair a per-instance directory whose files were already destroyed - additively, because an instance must never be without its filestore even briefly. Includes the operational consequences for backups (hardlinks must be preserved) and capacity planning (du overstates)."
