type: docs
breaking: false
description: |
  Die 36 leeren Changelog-Eintraege sind wiederhergestellt. Der Changelog
  reicht damit erstmals lueckenlos bis 8.0.0 zurueck.

  Bis zur Korrektur in 11.2.3 hat die Release-Automatik jede mehrzeilige
  Patchnote verschluckt und "- **Fix**: |" hinterlassen. Betroffen waren 36
  Eintraege in 25 Fassungen.

  Wiederherstellbar war das, weil jeder Release-Commit die Fragmente LOESCHT,
  die er verarbeitet hat - im Eltern-Commit stehen sie also noch. Das neue
  Werkzeug `scripts/rebuild_changelog_from_history.py` holt sie dort und
  laesst sie durch denselben Sammler laufen, der heute die Releases baut.

  Zwei Vorkehrungen, damit dabei nichts verloren geht:

  - Ein Abschnitt wird nur ersetzt, wenn JEDER vorhandene nicht-leere Eintrag
    im neu erzeugten Text wiederzufinden ist. Bei 8.0.0 hat das zunaechst
    angeschlagen - dort war ein zweiter Eintrag ebenfalls leer, nur in der
    Form "- **BREAKING**: | — |", die das Muster erst nicht erfasste.
  - Das Werkzeug ist wiederholbar: ein zweiter Lauf findet nichts mehr und
    erzeugt denselben Stand.

  Gegengeprueft: 131 Fassungs-Ueberschriften vorher wie nachher, die
  Fassungen ab 11.2.3 bitgleich, 0 leere Eintraege uebrig.

  Worauf beim Testen zu achten ist: `CHANGELOG.md` von unten nach oben
  durchblaettern - vor 11.2.3 stand dort ueberwiegend nichts, jetzt steht
  ueberall der Text, der damals geschrieben wurde.
