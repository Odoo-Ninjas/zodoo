type: major
description: |
  Eingeschaltetes pgBackRest hat auf Linux die Verbindung zu postgres gekappt:
  `odoo psql`, `odoo db reset` und alles, was von aussen an die Datenbank will,
  scheiterten mit "No such file or directory" auf dem Socket. Ursache war ein
  Docker-Volume auf /var/run/postgresql, das den Host-Bind-Mount ueberdeckte,
  durch den zodoo selbst spricht.

  Zum Testen auf einem Linux-Host: RUN_PGBACKREST=1 setzen, `odoo reload`,
  `odoo up -d`, dann `odoo psql`. Muss eine Sitzung oeffnen. Danach
  `odoo pgbackrest check` - der Sidecar muss postgres weiterhin erreichen.
breaking: false
