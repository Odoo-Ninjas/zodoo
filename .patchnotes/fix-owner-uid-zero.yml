type: fix
description: "OWNER_UID landet nicht mehr auf 0, und wenn doch, sagt zodoo warum. Wer aus einer Root-Shell mit 'sudo -iu odoo' in den Projektordner ging, bekam OWNER_UID=0 in die Settings geschrieben: sudo laesst SUDO_USER=root stehen, und whoami() hat SUDO_USER bedingungslos dem tatsaechlichen Benutzer vorgezogen. Der odoo-Container startet damit nicht - sein Entrypoint benennt den User mit dieser UID um, das ist root, und root gehoert PID 1. usermod verweigert das, der Container endet mit Exit 1 und der Meldung 'user root is currently used by process 1', in der OWNER_UID nicht vorkommt. Jetzt zaehlen SUDO_USER/SUDO_UID nur noch, wenn wir wirklich root sind ('sudo -u <anderer>' laesst die effektive UID gewinnen), 'odoo reload' bricht bei OWNER_UID=0 mit Hinweis auf 'su - <user>' ab, und reuid.py verweigert die Umbenennung des Users, dem PID 1 gehoert, mit Nennung der Ursache. Beim offiziellen Odoo-Image (ODOO_STANDARD_IMAGE=1) bleibt eine 0 erlaubt, weil dort unser Entrypoint gar nicht laeuft. Zum Testen: 'sudo -iu <user>' in ein Projekt, 'odoo reload' - muss jetzt mit klarer Meldung abbrechen statt einen Container zu bauen, der beim Start stirbt."
breaking: false
