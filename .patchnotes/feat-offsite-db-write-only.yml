type: feature
description: "Der Datenbankstrom kann jetzt auch write-only: Basisbackups und WAL-Segmente werden gegen einen oeffentlichen age-Schluessel (OFFSITE_WO_DB_RECIPIENT) verschluesselt und per PUT hochgeladen, die Maschine kann ihre eigenen Sicherungen also weder lesen noch loeschen. Moeglich, weil beide Quellen unveraenderlich sind und es nichts zu deduplizieren gibt. WAL geht minuetlich hoch (OFFSITE_WAL_CRON), damit ein Maschinenausfall eine Minute kostet und nicht eine Nacht; das laufende *.partial-Segment wird nie mitgenommen. Neue Befehle 'odoo offsite db' und 'odoo offsite wal'. Zwei Nebengewinne: die Vollstaendigkeit der WAL-Kette ist ohne Schluessel pruefbar (Namen aussen, Inhalt innen), und Aufbewahrung wird ueberhaupt erst moeglich - ein append-only restic-Repo laesst sich nicht aufraeumen, weil forget/prune den Repo-Key braucht."
breaking: false
