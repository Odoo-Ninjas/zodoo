type: bugfix
breaking: false
description: |
  Der globale Router laesst sich wieder deployen, wenn mindestens ein vhost mit
  `allowed_ips` konfiguriert ist. Vorher brach jeder Deploy-Versuch ab mit

      nginx: [emerg] duplicate location "/.well-known/acme-challenge/"

  und rollte zurueck - damit war KEINE vhost-Aenderung mehr moeglich, auch
  nicht an voellig unbeteiligten Hosts.

  Ursache: fuer vhosts mit Allowlist gibt `_ip_allowlist.inc` eine
  ACME-Location aus (damit certbot trotz Allowlist durchkommt), das
  `upstream`-Template gibt am Ende eine zweite aus. Das fiel jahrelang nicht
  auf, weil die zweite `accme-challenge` hiess - der Tippfehler hat die
  Kollision zufaellig verhindert. Mit dessen Korrektur kollidierten beide.

  Die Location im `upstream`-Template entfaellt jetzt fuer vhosts mit
  Allowlist; dort gilt die `^~`-Variante aus dem Include, die ohnehin Vorrang
  braucht.

  Zum Testen: auf einem Router mit einem `allowed_ips`-vhost
  `odoo router apply-vhosts --global` laufen lassen - es muss "Reloaded."
  kommen statt der emerg-Meldung. Danach in der gerenderten Datei dieses
  vhosts pruefen, dass `/.well-known/acme-challenge/` nur noch einmal
  vorkommt, und dass eine Zertifikatserneuerung dort weiterhin durchgeht.
