type: fix
description: "release workflow: the GitHub release is created again. The 'Create GitHub Release' step pasted the collected changelog entries straight into the shell script via ${{ }} interpolation. Patchnote descriptions are free prose, so their backticks were evaluated as command substitution and placeholders like <domain> parsed as redirects — the step aborted with a pile of 'command not found' and 'syntax error near unexpected token' messages, leaving tag and commit pushed but no release. This stayed invisible for as long as the step was being skipped. Tag and notes now travel through the step env and are written to a file for 'gh release create --notes-file', so no patchnote text is ever interpreted by the shell. The v7.2.0 release was created by hand after the fact."
breaking: false
