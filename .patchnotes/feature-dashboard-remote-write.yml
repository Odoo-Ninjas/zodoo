type: feature
description: 'Der Prometheus einer Instanz kann jetzt eine Kopie seiner Messwerte an eine zentrale Ablage schicken (remote_write) -- gedacht fuer den Betrieb mehrerer Maschinen, die bisher zwar jede fuer sich alles gemessen haben, aber ohne Stelle, an der das zusammenlaeuft. Der lokale Prometheus bleibt unveraendert die Detailsicht vor Ort. Einschalten mit DASHBOARD_REMOTE_WRITE_URL (leer = aus, dann aendert sich nichts), dazu _USER/_PASSWORD fuer den Zugang und _INSTANZ fuer den Namen, unter dem die Maschine in der Ablage erscheint (Label instanz). _INSTANZ ist Pflicht, sobald eine URL steht, und faellt bewusst NICHT auf $PROJECT_NAME zurueck -- der heisst auf vielen Installationen ueberall gleich, und die Messwerte der ganzen Flotte laegen dann uebereinander, ohne dass es auffiele; fehlt der Name, bleibt remote_write aus und sagt warum. Auf DEVMODE-Maschinen ist es aus (DASHBOARD_REMOTE_FORCE_IN_DEVMODE=1 schaltet es zum Testen ein). Technisch wird prometheus.yml dafuer je Projekt nach $HOST_RUN_DIR/dashboard/prometheus.yml gerendert und der Mount darauf umgebogen; bisher hing fuer alle Projekte dieselbe Datei aus dem Images-Verzeichnis im Container, und die kann keine Werte je Maschine tragen. Ohne die Einstellung passiert das nicht und der bisherige Mount bleibt. Zum Testen: URL und _INSTANZ setzen, odoo reload, dann $HOST_RUN_DIR/dashboard/prometheus.yml ansehen -- remote_write und external_labels muessen drinstehen -- und in der Ablage pruefen, ob Messwerte mit dem eigenen instanz-Label ankommen; ohne _INSTANZ muss odoo reload rot melden und nichts schicken.'
breaking: false
