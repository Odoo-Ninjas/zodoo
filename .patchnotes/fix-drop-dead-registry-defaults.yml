type: fix
description: "Registry: the default credentials admin/zebroo are gone. That account has not been valid on registry.zebroo.de for a long time (the registry answers 401), but every project got the pair written into its settings via lib_composer._set_defaults. That made every host look as if it had registry credentials — odoo build ran a docker login that could not succeed, and anyone reading the settings believed those were the credentials to use. There are no shared credentials any more: ZODOO_REGISTRY_USERNAME/PASSWORD come from ~/.odoo/settings only, odoo build asks for them once (and offers to request an account), and the username prompt now defaults to the OS user instead of admin. The URL default (registry.zebroo.de) stays. Docs updated in docs/06-registry.md."
breaking: false
