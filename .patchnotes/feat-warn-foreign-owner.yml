type: feature
description: "odoo warnt jetzt, wenn es aus einer Shell heraus benutzt wird, der das Projektverzeichnis gar nicht gehoert - der typische Fall ist eine Root-Shell in /home/odoo/odoo. Alles, was der Befehl dann anlegt, gehoert anschliessend root, und der eigentliche Benutzer kann es nicht mehr aendern. Das faellt erst viel spaeter auf und sieht dann nach etwas ganz anderem aus: ein Build bricht mit 'permission denied' ab, ein git-Checkout schlaegt fehl, ein Container startet nicht, weil er seine Settings-Datei nicht lesen kann - und zu dem Zeitpunkt denkt niemand mehr an den einen Befehl, der als falscher Benutzer lief. Die Meldung nennt beide Benutzer und sagt bei Root auch, was zu tun ist: 'su - <benutzer>' und ausdruecklich nicht 'sudo -iu <benutzer>', weil letzteres SUDO_USER=root stehen laesst und damit in die naechste Falle fuehrt (OWNER_UID=0, an dem der Container gar nicht erst startet). Es ist bewusst nur eine Warnung und kein Abbruch, denn es gibt legitime Gruende, als anderer Benutzer zu arbeiten. Geprueft wird nur innerhalb eines echten Projektbaums, damit ein 'odoo --help' in einem beliebigen fremden Verzeichnis nicht grundlos meckert; im Container wird gar nicht geprueft, weil der Entrypoint die UIDs dort absichtlich umschreibt. Zum Testen: in einem Projektverzeichnis 'sudo odoo version' aufrufen - es muss eine rote Warnung erscheinen, die den Verzeichnisbesitzer und root nennt. Als normaler Benutzer darf im selben Verzeichnis nichts kommen."
