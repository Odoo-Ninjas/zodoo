type: fix
description: >-
  Unter rootless Docker schrieb pgBackRest keine Logdatei mehr ("unable to
  open log file ... Permission denied"). Ursache: der Odoo-Container gab beim
  Start jedes root-eigene Verzeichnis per `chown -R` an OWNER_UID - unter
  rootless ist OWNER_UID aber 0 und das Run-Verzeichnis gehoert immer root,
  also lief bei jedem Start `chown -R 0:0` ueber das ganze Run-Verzeichnis und
  nahm pgbackrest.logs und pgbackrest/cert dem pgBackRest-Benutzer (uid 999)
  wieder weg. Mit OWNER_UID=0 wird jetzt nichts mehr umgeschrieben; auf
  normalen Maschinen aendert sich nichts.
  Zum Pruefen als rootless Benutzer - odoo build odoo, odoo up -d, dann
  `stat -c %u ~/.odoo/run/<projekt>/pgbackrest.logs` (subuid, nicht der
  eigene Benutzer) und nach `odoo pgbackrest info` liegen Dateien darin.
breaking: false
