type: bugfix
breaking: false
description: |
  Die Passphrase steht nicht mehr in der gemounteten `pgbackrest.conf`,
  sondern nur noch in der Umgebung der zwei Dienste, die sie brauchen:
  `postgres` (dort laeuft das archive_command) und der pgbackrest-Sidecar.

  Hintergrund: die Datei wird nach `/etc/pgbackrest` der Container gemountet
  und muss fuer den Container-Benutzer lesbar bleiben, also 0644. Das
  Verzeichnis enger zu ziehen hilft nicht - dann kaeme der Container selbst
  nicht mehr hin. Ein Geheimnis gehoert also nicht in diese Datei.

  pgBackRest liest jede Option auch aus der Umgebung
  (`PGBACKREST_<OPTION>`). Nachgewiesen am 02.09.2026 mit einem echten `info`
  gegen ein verschluesseltes Repository, das allein mit
  `PGBACKREST_REPO1_CIPHER_PASS` geoeffnet wurde - ohne die Zeile in der conf.

  `repo1-cipher-type` bleibt in der Datei und in `[global]`: dort gehoert es
  laut pgBackRest-Handbuch hin, damit `info` jede Stanza lesen kann, und es
  ist kein Geheimnis.

  Zum Nachsehen nach `odoo reload`:
  `grep -c cipher-pass <run-dir>/pgbackrest/pgbackrest.conf` ergibt 0, und
  `grep -c PGBACKREST_REPO1_CIPHER_PASS <run-dir>/docker-compose.yml` ergibt 2.

  Worauf zu achten ist: gesetzt wird erst NACH den Ausstiegen der Funktion.
  Ist pgBackRest abgeschaltet, wandert die Passphrase in keine einzige
  Umgebung - auch nicht in die von postgres.
