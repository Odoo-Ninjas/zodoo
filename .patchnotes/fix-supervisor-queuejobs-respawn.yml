type: fix
description: >-
  Der Supervisor im odoo-Container startet die queuejobs-Rolle nicht mehr
  endlos neu, wenn das Modul queue_job im Projekt nicht installiert ist.
  Bisher galt: der Supervisor deaktiviert die Rolle beim Start korrekt, aber ein
  spaeteres "start queuejobs" ueber den Control-Socket - das schickt jedes
  "odoo up" bzw. "odoo restart odoo_queuejobs" - setzte want_running auf True,
  ohne die Bedingung noch einmal zu pruefen. Das Kind prueft sie, meldet
  "Queue-Jobs shall not run" und beendet sich sauber; der Supervisor sah nur ein
  gestorbenes Kind und startete es neu - rund einmal pro Sekunde, dauerhaft.
  Jeder dieser Starts rendert die komplette odoo-Config neu, entsprechend hoch
  war die Grundlast auf der Maschine, und im Log war vor Neustart-Spam nichts
  mehr zu finden. Neu wird die Bedingung erneut geprueft, bevor eine Rolle
  respawnt oder per Socket gestartet wird; ist sie aus, bleibt die Rolle
  gestoppt und es gibt genau eine erklaerende Log-Zeile.
  Zum Nachvollziehen auf einem Projekt ohne queue_job: "odoo up -d", dann
  "docker logs -f <projekt>_odoo" - es darf keine wiederkehrende Zeile
  "[supervisor] [queuejobs] spawn" mehr auftauchen, und in "odoo status" bzw.
  ueber den Control-Socket steht die Rolle queuejobs auf want_running=false.
breaking: false
