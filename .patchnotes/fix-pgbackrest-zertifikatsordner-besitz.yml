type: fix
description: >-
  `odoo pgbackrest info` und `check` melden nach einer Neuanmeldung nicht mehr
  `[CryptoError] unable to set user-defined CA certificate location`. Zu
  pruefen: auf einer Maschine mit pgBackRest `odoo pgbackrest register`
  laufen lassen, waehrend der Stack laeuft, und danach ohne Neustart `odoo
  pgbackrest info` aufrufen - es muss `status: ok` zeigen statt des
  Krypto-Fehlers. Hintergrund: der Zertifikatsordner gehoerte nach dem
  Anmelden wieder dem Betriebsbenutzer statt dem pgbackrest-Benutzer, der
  Ordner steht auf 0700. Gesichert wurde dabei weiter - blind waren nur die
  Befehle, mit denen man nachsieht, ob noch gesichert wird.
breaking: false
