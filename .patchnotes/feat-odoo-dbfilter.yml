type: feature
description: "Neues Setting ODOO_DBFILTER, mit dem sich einstellen laesst, welche Datenbanken eine Instanz bedient (odoo.conf dbfilter). Bisher gab es dafuer gar keinen Schalter: unsere Templates setzen db_name, aber keinen dbfilter, und Odoo nimmt dann db_name als Allowlist. Mit ODOO_ENABLE_DB_MANAGER=1 fuehrt das zu einem halb funktionsfaehigen DB-Manager - neu angelegte Datenbanken entstehen in Postgres, tauchen in der Liste aber nicht auf, sind per HTTP nicht erreichbar und lassen sich auch nicht mehr loeschen, weil beim Loeschen gegen dieselbe Liste geprueft wird. Der Default ist leer, damit sich ohne Zutun nichts aendert; wer den DB-Manager wirklich benutzen will, setzt ODOO_DBFILTER=.*. Beim 'odoo reload' weist eine Meldung darauf hin, wenn der Manager an ist, der dbfilter aber nur die Projekt-DB durchlaesst - automatisch aufmachen waere falsch, das wuerde aus einem Debug-Schalter still eine Instanz machen, die auf jeden DB-Namen antwortet. Das Setting wirkt in beiden Wegen, im gebauten Image (Versionen 12 bis 19) und im Pfad mit dem offiziellen Odoo-Image. Zum Testen: ODOO_ENABLE_DB_MANAGER=1 und ODOO_DBFILTER=.* setzen, 'odoo reload && odoo up -d', dann im DB-Manager eine zweite Datenbank anlegen - sie muss danach in der Liste stehen und wieder loeschbar sein."
breaking: false
