type: feature
description: >-
  zodoo laeuft jetzt auch unter rootless Docker (ein Unix-Benutzer je Instanz,
  jeder mit eigenem Docker-Daemon). Bisher scheiterte das eigene Image dort am
  uid-Mapping: der Entrypoint benannte odoo auf die Host-uid um, die im
  Container aber eine fremde subuid ist - danach gehoerte das Run-Verzeichnis
  auf dem Wirt niemandem mehr, den der Benutzer kennt, und die CLI brach mit
  PermissionError ab. Neu erkennt `odoo reload` einen rootless Daemon selbst
  (oder per DOCKER_ROOTLESS=1), laesst Odoo im Container als root laufen
  (das ist dort der Benutzer selbst) und chownt auf dem Wirt auf den
  aufrufenden Benutzer. Auf normalen Maschinen aendert sich nichts.
  Zum Pruefen als rootless Benutzer - odoo reload, build, up -d: /web/login
  antwortet, und `find ~/.odoo ! -user $USER` findet ausserhalb von
  ~/.local/share/docker nichts.
breaking: false
