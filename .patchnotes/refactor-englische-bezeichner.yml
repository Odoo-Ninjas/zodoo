type: internal
breaking: false
description: |
  Die deutschen Funktionsnamen im pgBackRest-Teil heissen jetzt englisch.

  Rein mechanisch, kein Verhalten geaendert - aber es betrifft Namen, die in
  Tracebacks und Logzeilen auftauchen, deshalb hier vermerkt:

    _aus_umschlag                        -> _from_envelope
    _bench_umgebung                      -> _bench_environment
    _bestandsname                        -> _store_name
    _check_ablegen                       -> _record_check
    _luecken                             -> _wal_gaps
    _nach_verwurf_vollsicherung           -> _full_backup_after_drop
    _verify_ausgabe_lesen                -> _read_verify_output
    neuester_umschlag                    -> newest_envelope
    umschlag_bereiche                    -> envelope_areas
    umschlag_oeffnen                     -> open_envelope
    _spool_und_verworfen                 -> _spool_and_dropped
    _passphrase_aus_umgebungen_entfernen -> _strip_passphrase_from_environments
    _passphrase_injizieren               -> _inject_passphrase

  Eine Aenderung ist mehr als ein Name: das Ergebnisfeld `wal_luecken` heisst
  jetzt **`wal_gaps`**. Es steht in den Ergebnisdateien von
  `odoo pgbackrest repo-verify`. Geprueft, dass es auf dem Pruefstand niemand
  ausliest (die Auswertung dort nimmt `result` und `kind`) - wer eigene
  Auswertungen darauf gebaut hat, muss nachziehen.

  Deutsche PROSA in Kommentaren und in den HELP-Texten der Kennzahlen bleibt
  absichtlich stehen. Das sind Begruendungen fuer uns, keine Bezeichner, und
  die HELP-Texte liest ein Mensch in Grafana - sie zu uebersetzen haette
  Erklaerungen gekostet, ohne etwas zu verbessern.
