type: fix
breaking: false
description: |
  "odoo build" sagt jetzt selbst, wenn ein Docker-Plugin fehlt - mit dem
  Befehl zum Nachinstallieren.

  Anlass war eine frische Ubuntu 26.04: dort bringt das Paket docker.io
  (Docker 29) kein buildx mit. Docker fährt BuildKit aber als Standard, also
  bricht der Build sofort mit "BuildKit is enabled but the buildx component is
  missing or broken" ab. Bitter wird es danach: weil das Basis-Image dadurch
  nie entsteht, versucht der nächste Schritt es aus der Registry zu ziehen,
  und man sieht nur noch "pull access denied ... odoo_base_17_..." - man sucht
  dann bei den Registry-Zugangsdaten, obwohl bloß ein Paket fehlt.

  Jetzt prüft "odoo build" vor dem Start, ob "docker compose" und
  "docker buildx" da sind. Fehlt compose, bricht es sofort ab (ohne compose
  läuft gar nichts). Fehlt buildx, kommt eine gelbe Warnung samt Hinweis, dass
  der Rückfallweg auf aktuellem Docker ebenfalls nicht baut. Und wenn der Build
  doch an der buildx-Meldung stirbt, endet er mit dem Klartext-Hinweis statt
  mit dem irreführenden Folgefehler. In der Meldung stehen beide Paketnamen,
  weil sie sich je nach Docker-Quelle unterscheiden: docker-buildx /
  docker-compose-v2 (Distributions-Docker) bzw. docker-buildx-plugin /
  docker-compose-plugin (Docker-eigenes Repo).

  Zum Nachschauen: auf einer Maschine mit Docker, aber ohne buildx (z.B.
  Ubuntu 26.04 nach "apt install docker.io"), im Projekt "odoo build"
  aufrufen. Es muss gleich am Anfang die gelbe Meldung mit dem
  apt-install-Befehl kommen, nicht erst nach Minuten ein Fehler über eine
  Registry. Nach "apt install docker-buildx" ist die Meldung weg und der Build
  läuft normal durch. In der Installationsanleitung stehen die Pakete
  inzwischen ebenfalls.
