type: fix
description: "odoo build: the pre-flight check for the prebuilt Python image no longer rebuilds an image that is already there. On a host that was never logged in to the registry three things went wrong: zodoo has ZODOO_REGISTRY_USERNAME/PASSWORD in the settings but never handed them to docker, so the registry answered every query with a 401; a 401 was counted as 'image not in registry' just like a real miss; and nobody looked into the local docker store, although a FROM resolves against it. Result was a ~12 minute rebuild of an image that was sitting on the machine. Now a failed registry query is classified: 'the registry says no' (rebuild, as before) versus 'we could not ask' (401, DNS, TLS, refused connection). In the second case zodoo logs in with the credentials from the settings and asks again, and if it still cannot ask, a local copy of the image is used instead of rebuilding — checked against the architecture docker reports, and skipped for 'odoo build --pull', where BuildKit re-resolves every FROM against the registry anyway. An unclear error message counts as 'could not ask' and is printed in red with a hint to the credentials, instead of quietly costing a rebuild. A local image is never pushed: the tag carries no content hash, so an old local copy must not end up in the shared registry — a real miss is rebuilt from current sources as before."
breaking: false
