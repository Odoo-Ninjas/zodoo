type: fix
description: "odoo build: the pre-flight check for the prebuilt Python image no longer rebuilds an image that is already there. Three things went wrong on a host that was never logged in to the registry: zodoo has ZODOO_REGISTRY_USERNAME/PASSWORD in the settings but never handed them to docker, so the registry answered every query with a 401; a 401 was counted as 'image not in registry' just like a real miss; and nobody looked into the local docker store, although a FROM resolves against it. Result was a ~12 minute rebuild of an image that was sitting on the machine. Now the hook logs in first when credentials are configured, tells 'registry says no' apart from 'could not ask the registry' (auth, DNS, TLS, refused connection), skips the rebuild when the image is in the local store, and pushes it instead when it really is missing in the registry. An unclear error message now counts as 'could not ask' and is printed in red with a hint to the credentials, instead of quietly costing a rebuild."
breaking: false
