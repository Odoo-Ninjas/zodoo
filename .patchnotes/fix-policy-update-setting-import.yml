type: fix
description: |
  `odoo pgbackrest policy` holt die Aufbewahrungs-Vorgabe vom Backup-Server
  und legt sie als `PGBR_RETENTION_FULL_EFFECTIVE` in den Einstellungen ab.
  Der Befehl brach dabei bisher mit `NameError: name 'update_setting' is not
  defined` ab - der Helfer, der schreibt, hatte den Import nicht (in dieser
  Datei wird `update_setting` in jeder Funktion einzeln importiert).

  Zum Nachvollziehen: auf einer registrierten Instanz `odoo pgbackrest policy`
  aufrufen. Erwartet wird die Meldung mit den vorgegebenen Tagen; danach steht
  in `~/.odoo/settings.<projekt>` ein `PGBR_RETENTION_FULL_EFFECTIVE`, und nach
  `odoo reload` taucht der Wert als `repo1-retention-full` in der erzeugten
  `pgbackrest.conf` auf.
breaking: false
