type: internal
description: >-
  CI baut die projektunabhaengigen Images (postgres, proxy, cronjobs, barman,
  rsync, console, pgtools) und schiebt sie in die zodoo-Registry. Frisch
  aufgesetzte Maschinen ziehen sie damit, statt sie selbst zu bauen -- gemessen
  6:24 von 11:44 Aufsetzzeit. Laeuft bei jeder Aenderung an den Images und
  woechentlich, weil jede Aenderung neue Tags erzeugt und der Bestand sonst
  still verfaellt. Braucht die Secrets ZODOO_REGISTRY_USERNAME und
  ZODOO_REGISTRY_PASSWORD.
breaking: false
