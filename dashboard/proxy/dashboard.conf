# proxy_host: grafana:3000
# Grafana is configured with GF_SERVER_SERVE_FROM_SUB_PATH=true and
# root_url .../system/ , so the /system prefix is kept (NOT stripped) and
# forwarded as-is to Grafana.
location /system {
    set $backend $default_target;
    access_by_lua_file "{lua_resolve_host}";

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_pass $backend;

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;

    proxy_read_timeout 86400s; # keep Grafana Live (websocket) connections open
    error_page 502 503 504 = @fallback;
}
