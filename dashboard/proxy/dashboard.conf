# proxy_host: grafana:3000
# Password-only auth gate (no username, unlike HTTP basic auth). A minimal
# login page asks for DASHBOARD_PASSWORD, sets a signed cookie and lets
# following requests through (see proxy/lua/dashauth.lua). Grafana itself
# stays anonymous, so /system, /logs and /logs2 need no Grafana login -- just
# the password. Empty password (e.g. DEVMODE) -> gate disabled.
# NOTE: the password is sent in the login POST body, so terminate TLS in front
# of this proxy on internet-facing deployments (otherwise it is sniffable on
# plain HTTP). Fine on localhost/LAN dev.
# Grafana is configured with GF_SERVER_SERVE_FROM_SUB_PATH=true and
# root_url .../system/ , so the /system prefix is kept (NOT stripped) and
# forwarded as-is to Grafana.

# Friendly entry points (kiosk = no Grafana chrome, just the dashboard):
#   /system -> full instance overview
#   /logs   -> log-focused view (replaces the old log.io UI)
# absolute_redirect off keeps the Location header relative so the browser
# preserves the original host:port (the proxy only knows its internal :80).
location = /system  { absolute_redirect off; return 302 /system/d/zodoo-overview/zodoo-instance-overview?kiosk; }
location = /system/ { absolute_redirect off; return 302 /system/d/zodoo-overview/zodoo-instance-overview?kiosk; }
# /logs is a searchable log explorer -> no kiosk, so the search/filter bar shows.
location = /logs    { absolute_redirect off; return 302 /system/d/zodoo-logs/zodoo-logs; }
location = /logs/   { absolute_redirect off; return 302 /system/d/zodoo-logs/zodoo-logs; }
# /logs2 -> raw Grafana Explore on Loki (full ad-hoc query UI, live tail, label browser)
location = /logs2   { absolute_redirect off; return 302 "/system/explore?schemaVersion=1&orgId=1&panes=%7B%22zod%22%3A%7B%22datasource%22%3A%22loki%22%2C%22queries%22%3A%5B%7B%22refId%22%3A%22A%22%2C%22datasource%22%3A%7B%22type%22%3A%22loki%22%2C%22uid%22%3A%22loki%22%7D%2C%22expr%22%3A%22%7Bjob%3D%5C%22docker%5C%22%7D%22%7D%5D%2C%22range%22%3A%7B%22from%22%3A%22now-1h%22%2C%22to%22%3A%22now%22%7D%7D%7D"; }

location /system {
    set $backend $default_target;
    # Grafana's own pages/API (constant 30s auto-refresh) would otherwise fill
    # the access log; the request metrics are meant for the Odoo app, not the
    # dashboard. Skip access logging here entirely.
    access_log off;
    # Throttle login attempts on /system/__auth (the map keys the limit to that
    # path only; every other /system request has an empty key and is skipped).
    limit_req zone=dashauth burst=5 nodelay;
    limit_req_status 429;
    # Password-only gate (rewrite phase runs before the access phase below, so
    # an unauthenticated request never reaches Grafana).
    rewrite_by_lua_block {
        require("dashauth").gate(os.getenv("DASHBOARD_PASSWORD"))
    }
    access_by_lua_file "{lua_resolve_host}";

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_pass $backend;

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;

    proxy_read_timeout 86400s; # keep Grafana Live (websocket) connections open
    error_page 502 503 504 = @fallback;
}
