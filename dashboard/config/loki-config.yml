# Single-binary Loki, filesystem storage. Sized for one Odoo instance.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: ${DASHBOARD_LOKI_RETENTION}
  reject_old_samples: false
  allow_structured_metadata: true
  volume_enabled: true
  # Generous ingest limits: on (re)start Alloy ships the whole container-log
  # backlog at once, which trips the stock 4MB/s limit.
  ingestion_rate_mb: 32
  ingestion_burst_size_mb: 64
  per_stream_rate_limit: 16MB
  per_stream_rate_limit_burst: 32MB

compactor:
  working_directory: /loki/compactor
  delete_request_store: filesystem
  retention_enabled: true

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

analytics:
  reporting_enabled: false
