# Explicit, PG17-compatible metrics for the dashboard. The exporter runs with
# --disable-default-metrics (its legacy built-ins query the checkpoints_timed
# column removed in PG17), so everything the Postgres panels need is defined
# here. Custom-query metrics are named <namespace>_<column>.
odoo_db:
  query: "SELECT pg_database_size(current_database()) AS size_bytes, (SELECT count(*) FROM pg_stat_activity WHERE datname = current_database()) AS connections"
  master: true
  metrics:
    - size_bytes:
        usage: "GAUGE"
        description: "On-disk size of the Odoo database in bytes"
    - connections:
        usage: "GAUGE"
        description: "Active connections to the Odoo database"

# -> odoo_db_activity_{xact_commit,xact_rollback,blks_hit,blks_read} (counters)
odoo_db_activity:
  query: "SELECT COALESCE(sum(xact_commit),0) AS xact_commit, COALESCE(sum(xact_rollback),0) AS xact_rollback, COALESCE(sum(blks_hit),0) AS blks_hit, COALESCE(sum(blks_read),0) AS blks_read FROM pg_stat_database WHERE datname = current_database()"
  master: true
  metrics:
    - xact_commit:
        usage: "COUNTER"
        description: "Committed transactions"
    - xact_rollback:
        usage: "COUNTER"
        description: "Rolled-back transactions"
    - blks_hit:
        usage: "COUNTER"
        description: "Buffer cache hits"
    - blks_read:
        usage: "COUNTER"
        description: "Disk blocks read"
