global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Container CPU / RAM / network / disk IO
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # Host / VM CPU, memory, filesystem, disk IO
  - job_name: node
    static_configs:
      - targets: ["node_exporter:9100"]

  # PostgreSQL health + custom Odoo queries (mails, db size)
  - job_name: postgres
    static_configs:
      - targets: ["postgres_exporter:9187"]

  # nginx stub_status -> concurrent connections
  - job_name: nginx
    static_configs:
      - targets: ["nginx_exporter:9113"]

  # request metrics extracted from the nginx JSON access log by Alloy
  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]

  # Odoo-specific: worker settings, filestore size
  - job_name: odoo_metrics
    static_configs:
      - targets: ["odoo_metrics_exporter:9333"]
