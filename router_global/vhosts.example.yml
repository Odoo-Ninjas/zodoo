# Beispiel fuer <install_dir>/vhosts.yml  (global: /opt/proxy/vhosts.yml)
# Es ist eine LISTE von vHosts. Gleiches Schema wie web_router.virtual_hosts
# in ansible. JSON geht genauso - vhosts.yml wird mit yaml.safe_load gelesen,
# und YAML ist eine Obermenge von JSON.
#
# Anwenden:  odoo router apply-vhosts --global
# Einzeln:   odoo router vhost add --global <datei-mit-einem-dict>.yml
# Zertifikate: odoo router ssl --global
#   use_certbot: true  -> Let's Encrypt-Zertifikat
#   ssl_self_signed: true -> wird automatisch beim Anwenden erzeugt (kein ACME),
#   odoo router ssl ist dann nicht noetig (siehe Beispiel 6).

# ---------------------------------------------------------------------------
# 1. Odoo-Instanz - dafuer gibt es ein eigenes Template, das gleich den
#    Longpolling-/Chat-Upstream auf Port 8072 mitanlegt.
# ---------------------------------------------------------------------------
- template: upstream_direct_odoo
  server_name: kunde.zebroo.de
  upstream_name: kunde_odoo # nur [A-Za-z0-9_]! Siehe Hinweis unten.
  upstream_server: 192.168.77.130 # LAN-IP der Maschine, nicht die VPN-IP
  upstream_port: 6000 # proxy_port der Instanz
  timeout: 600
  use_certbot: true

# ---------------------------------------------------------------------------
# 2. Normaler Dienst, abgeschottet: nur aus unseren Netzen erreichbar,
#    zusaetzlich Basic Auth und eine Ratenbegrenzung.
# ---------------------------------------------------------------------------
- template: upstream
  server_name: grafana.zebroo.de
  upstream_name: grafana
  upstream_server: 192.168.77.6
  upstream_port: 8080
  timeout: 120
  use_certbot: true
  # STRING, nicht Liste - komma- oder semikolongetrennt:
  allowed_ips: "10.222.0.0/22, 192.168.77.0/24"
  # Pfade, die trotz Allowlist offen bleiben (z.B. eine API von aussen):
  allowlist_public_paths: "/api/webhook"
  # DICT username -> Klartextpasswort; wird per openssl passwd -apr1 gehasht:
  basic_auth:
    zebroo: bitte-aendern
  rate_limit: 30r/m
  rate_limit_burst: 20
  client_max_body_size: 512M

# ---------------------------------------------------------------------------
# 3. Weiterleitung auf eine andere Domain oder eine bestimmte Seite.
#    Steht im Ziel ein Pfad (also ein "/"), landet alles genau dort;
#    ohne Pfad wird der aufgerufene Pfad angehaengt.
# ---------------------------------------------------------------------------
- template: redirect
  server_name: alt.zebroo.de
  redirect_to: zebroo.de/zebroo-experience
  use_certbot: true

# ---------------------------------------------------------------------------
# 4. Statische Dateien aus einem Verzeichnis.
# ---------------------------------------------------------------------------
- template: static_files
  server_name: downloads.zebroo.de
  folder: /var/www/downloads
  certificate_name: downloads.zebroo.de
  ssl_key_is_on_destination: true

# ---------------------------------------------------------------------------
# 5. Das absolute Minimum fuer einen Upstream - mehr braucht es nicht.
# ---------------------------------------------------------------------------
- template: upstream
  server_name: minimal.zebroo.de
  upstream_name: minimal
  upstream_server: 127.0.0.1
  upstream_port: 8069
  timeout: 600

# ---------------------------------------------------------------------------
# 6. TLS OHNE Internet / ohne Let's Encrypt: ein geschuetztes LAN kommt nicht
#    an die ACME-Verifizierung von aussen. ssl_self_signed erzeugt dann selbst
#    ein selbstsigniertes Zertifikat (auf dem Host) und laesst den vhost auf
#    443 hoeren; HTTP bekommt einen 301-Redirect auf https.
#    certificate_name ist optional - fehlt es, heisst das Zertifikatsverzeichnis
#    server_name und liegt unter custom_ssl/<server_name>/.
#    Ein Zertifikat, das man self-signed selbst dort ablegt, wird UBERNOMMEN
#    und nicht ueberschrieben. "odoo router ssl" ist dazu nicht noetig.
# ---------------------------------------------------------------------------
- template: upstream
  server_name: lan.internal.zebroo.de
  upstream_name: lan_internal
  upstream_server: 192.168.77.20
  upstream_port: 8069
  timeout: 600
  ssl_self_signed: true
